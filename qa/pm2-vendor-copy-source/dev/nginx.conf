user www-data;
worker_processes auto;
pid /run/panel-nginx/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 1024; }
http {
  include /etc/panel/waf/http.d/*.conf;
  server_names_hash_bucket_size 512;
  server_names_hash_max_size 4096;
  log_format panel_site escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$panel_log_path","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"agent":"$http_user_agent","referer":"$panel_log_referer"}';
  map $http_referer $panel_log_referer { ~^(?<panel_referer_base>[^?]*) $panel_referer_base; default ''; }
  map $request_uri $panel_log_path { ~^(?<panel_original_path>[^?]*) $panel_original_path; default $uri; }
  map $http_upgrade $panel_connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  client_body_temp_path /var/cache/panel-nginx/client;
  proxy_temp_path /var/cache/panel-nginx/proxy;
  fastcgi_temp_path /var/cache/panel-nginx/fastcgi;
  uwsgi_temp_path /var/cache/panel-nginx/uwsgi;
  scgi_temp_path /var/cache/panel-nginx/scgi;
  server_tokens off;
  server { include /etc/panel/waf/server.d/*.conf; listen 127.0.0.1:19101 default_server; server_name _; return 404; }
  server { include /etc/panel/waf/server.d/*.conf; listen 127.0.0.1:19102 ssl default_server; server_name _; ssl_reject_handshake on; }
  server { include /etc/panel/waf/server.d/*.conf; listen 0.0.0.0:80 default_server; listen [::]:80 default_server; server_name _; return 404; }
  server { include /etc/panel/waf/server.d/*.conf; listen 0.0.0.0:443 ssl default_server; listen [::]:443 ssl default_server; server_name _; ssl_reject_handshake on; }
  include /etc/panel/sites-enabled/*.conf;
  include /etc/panel/panel-access.conf;
}
