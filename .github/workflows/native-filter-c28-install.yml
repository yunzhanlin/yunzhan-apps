name: actual native C28 AMD64 account store and filter reallocation

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-filter-c28-install.yml
      - scripts/native-filter-c28/**

permissions:
  contents: read

concurrency:
  group: native-filter-c28-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download exact signed private-QA cohort without passing tokens to guest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-filter-c28-assets"
          gh release download qa-filtercandidate28-20261029 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-filter-c28-assets"
          python3 - "$RUNNER_TEMP/native-filter-c28-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '47445ec46d294395f57972c5f69fc89de574ae8bc47724a5e81f8f05360aa641'
          manifest = json.loads((base / 'assets.json').read_bytes())
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Exact original signatures, public trust root and source-bound QA helpers downloaded; no credentials in payload')
          PY
      - name: Prepare hardware guest tools without removing existing host software
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual F59 to C28 signed upgrade account creation store update TCP UDP egress and real filter reallocation
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-filter-c28-public"
          sudo -n python3 -I -B scripts/native-filter-c28/kvm.py "$RUNNER_TEMP/native-filter-c28-assets" scripts/native-filter-c28 "$RUNNER_TEMP/native-filter-c28-public"
      - name: Retain public proof and encrypted full QA evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-filter-c28-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-filter-c28-public/
          retention-days: 7
          if-no-files-found: warn
