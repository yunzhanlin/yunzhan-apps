name: C66 QA2 original signed native browser acceptance with draft download authorization

on:
  push:
    branches: [codex/analytics-heatmap-c66-native-qa2]
    paths: [scripts/native-analytics-c66/dispatch.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: c66-original-native-browser-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actual-native-signed-browser:
    permissions:
      contents: write
      actions: read
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/analytics-heatmap-c66-native-qa2'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Independently require completed original source CI and pinned signed release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/c66-public"
          python3 -I -B scripts/native-analytics-c66/download-qa2.py "$RUNNER_TEMP/c66-assets" "$RUNNER_TEMP/c66-private"
      - name: Install exact browser driver and standard Linux browser dependencies
        run: |
          set -eu
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/native-analytics-c66
          node scripts/native-analytics-c66/node_modules/playwright-core/cli.js install-deps chromium
      - name: Retain inactive distribution Nginx conffile and use one normal original signed installation
        run: |
          set -eu
          umask 077
          sudo -n env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-analytics-c66/prepare.py "$RUNNER_TEMP/c66-assets" "$RUNNER_TEMP/c66-private" > "$RUNNER_TEMP/c66-private/prepare-step.stdout" 2> "$RUNNER_TEMP/c66-private/prepare-step.stderr"
      - name: Real sandboxed full Chromium back and forward restores trusted clicks and actual390 pixel product UI
        run: |
          set -eu
          umask 077
          node scripts/native-analytics-c66/browser.mjs "$RUNNER_TEMP/c66-private" > "$RUNNER_TEMP/c66-private/browser-step.stdout" 2> "$RUNNER_TEMP/c66-private/browser-step.stderr"
      - name: Independently reconcile original SQL raw transmissions report graph details and lifetimes then encrypt retained evidence
        if: always()
        run: |
          set -eu
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/c66-private" "$RUNNER_TEMP/c66-public"
          sudo -n env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-analytics-c66/finish.py "$RUNNER_TEMP/c66-private" "$RUNNER_TEMP/c66-public"
      - name: Retain original numeric result and encrypted evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c66-original-native-browser-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c66-public/
          retention-days: 14
          if-no-files-found: error
