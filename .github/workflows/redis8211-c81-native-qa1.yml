name: Redis 8.2.11 native installation and original instance preservation
on:
  push:
    branches: [codex/redis8211-c81-native-qa1]
    paths: [scripts/native-redis8211-c81/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  redis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-redis8211-c81/download.py "$RUNNER_TEMP/redis-inputs" "$RUNNER_TEMP/redis-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-redis8211-c81/bootstrap-original-install.py "$RUNNER_TEMP/redis-inputs" "$RUNNER_TEMP/redis-private" > "$RUNNER_TEMP/redis-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/redis-private/bootstrap-step.stderr"
      - name: Verify parallel Redis runtimes, ACL, and persisted data
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-redis8211-c81/redis.py "$RUNNER_TEMP/redis-private" > "$RUNNER_TEMP/redis-private/redis-step.stdout" 2> "$RUNNER_TEMP/redis-private/redis-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-redis8211-c81/finish.py "$RUNNER_TEMP/redis-private" "$RUNNER_TEMP/redis-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c81-redis8211-native-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/redis-public/
          if-no-files-found: error
          retention-days: 14
