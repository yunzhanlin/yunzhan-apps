name: C71 original signed Compose delivery source on both native architectures
on:
  push:
    branches: [codex/compose-signed-image-c71-release]
    paths: [scripts/compose-signed-image-c71/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c71-compose-original-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-signed-recipes:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/compose-signed-image-c71-release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify the exact original signed source and exercise the full affected packages
        run: |
          set -eu
          umask 077
          python3 -I -B scripts/compose-signed-image-c71/verify-and-run.py "$RUNNER_TEMP/c71-original-source"
      - name: Retain original Go output and proof including any refusal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c71-original-compose-source-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c71-original-source/
          retention-days: 14
          if-no-files-found: error
