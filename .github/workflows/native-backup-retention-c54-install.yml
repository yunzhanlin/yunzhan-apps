name: Actual C54 QA2 five OS signed upgrade real backup retention and hard powerloss

on:
  push:
    branches: [codex/backup-retention-c54-native-qa2]
    paths: [scripts/native-backup-retention-c54/dispatch.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-backup-retention-c54-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/backup-retention-c54-native-qa2'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify immutable dual native CI and original nonempty retention execution records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/retention-c54-ABI"
          gh api repos/yunzhanlin/yunzhan-apps/actions/runs/41471366385 > "$RUNNER_TEMP/retention-c54-ABI/run.json"
          gh run download 41471366385 --repo yunzhanlin/yunzhan-apps --pattern 'backup-retention-native-*' --dir "$RUNNER_TEMP/retention-c54-ABI/events"
          python3 - "$RUNNER_TEMP/retention-c54-ABI" <<'PY'
          import json,pathlib,subprocess,sys
          root=pathlib.Path(sys.argv[1]);run=json.loads((root/'run.json').read_bytes())
          assert run['id']==41471366385 and run['head_sha']=='4610c0ede2df6a9c6661ff181b1106d81261f881' and run['status']=='completed' and run['conclusion']=='success'
          files=sorted((root/'events').glob('*/backup-retention-native.jsonl'));assert len(files)==2
          assert {f.parent.name for f in files}=={'backup-retention-native-ubuntu-24.04-41471366385','backup-retention-native-ubuntu-24.04-arm-41471366385'}
          for file in files:subprocess.run(['node','tools/check-retention-native-execution.mjs',str(file)],check=True)
          print('Original AMD64 and ARM64 each executed45 retention PASS records without skips; installed acceptance remains separate')
          PY
      - name: Download and bind both original key signed programme cohorts and reviewed payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-retention-c54-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/431440563 > "$RUNNER_TEMP/retention-C53r3-cohort.json"
          gh api repos/yunzhanlin/yunzhan-apps/releases/431668180 > "$RUNNER_TEMP/retention-C54-cohort.json"
          python3 - "$RUNNER_TEMP/retention-C53r3-cohort.json" "$RUNNER_TEMP/retention-C54-cohort.json" <<'PY'
          import json,sys
          for file,rid,tag,head in [(sys.argv[1],431440563,'qa-analyticsidentitycandidate53r3-20261102-qa1','19294c833de1bf045e68e2f3be94ad9011a58511'),(sys.argv[2],431668180,'qa-backupretentioncandidate54-20261103-qa1','4610c0ede2df6a9c6661ff181b1106d81261f881')]:
              v=json.load(open(file));assert v['id']==rid and v['tag_name']==tag and v['target_commitish']==head and not v['draft']and v['prerelease']and len(v['assets'])==7
          PY
          gh release download qa-analyticsidentitycandidate53r3-20261102-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*linux-amd64.tar.gz*' --dir "$RUNNER_TEMP/native-retention-c54-assets"
          gh release download qa-backupretentioncandidate54-20261103-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*linux-amd64.tar.gz*' --pattern release-signing-dev.pub --dir "$RUNNER_TEMP/native-retention-c54-assets"
          cp scripts/native-backup-retention-c54/guest.py scripts/native-backup-retention-c54/business.py scripts/native-backup-retention-c54/cold.py scripts/native-backup-retention-c54/baseline-guest.py scripts/native-backup-retention-c54/capture.py scripts/native-backup-retention-c54/preservation.py "$RUNNER_TEMP/native-retention-c54-assets/"
          cp candidate/panel-integration-load-balance/packaging/signed-release.py "$RUNNER_TEMP/native-retention-c54-assets/"
          cp scripts/native-backup-retention-c54/payload.json "$RUNNER_TEMP/native-retention-c54-assets/assets.json"
          python3 - "$RUNNER_TEMP/native-retention-c54-assets" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert sha(root/'assets.json')=='60f5b38d6f3c131c13a0aae638f02a1fac8bebad5784d3e18459f4ef8f589caf'
          manifest=json.loads((root/'assets.json').read_bytes());assert manifest['source_inputs_sha256']=='2b8e71c50b16ba6008955a4d9168b195a087e3063412445a0596f27b53b1bfb9'and len(manifest['files'])==14
          for n,h in manifest['files'].items():
              assert pathlib.PurePath(n).name==n and sha(root/n)==h
              if n.endswith('.py'):ast.parse((root/n).read_bytes())
          source=pathlib.Path('scripts/native-backup-retention-c54')
          assert sha(source/'kvm.py')=='3f6955e7c1e1e48843a7efe8c7a718868b67aaefe7b10cc11809299d45eb186a'
          for n in('guest.py','business.py','cold.py','baseline-guest.py','capture.py','preservation.py'):assert (root/n).read_bytes()==(source/n).read_bytes()
          print('Original signed C53r3 and C54 assets and once-only real retention payload verified')
          PY
      - name: Prepare native KVM hardware tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual signed install and upgrade real backup failure fairness Core crash and whole VM hard powerloss
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-retention-c54-public"
          sudo -n python3 -I -B scripts/native-backup-retention-c54/kvm.py "$RUNNER_TEMP/native-retention-c54-assets" scripts/native-backup-retention-c54 "$RUNNER_TEMP/native-retention-c54-public" "$OS_CASE"
      - name: Retain public proof and encrypted original guest evidence including failed cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-retention-c54-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-retention-c54-public/
          retention-days: 7
          if-no-files-found: error
