name: Signed load balancing prerequisite refusal, retry and native traffic
on:
  push:
    branches: [codex/load-balance-c112-native-qa1]
    paths: [scripts/native-load-balance-c112/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  load-balance-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-load-balance-c112/download.py "$RUNNER_TEMP/load-balance-native-inputs" "$RUNNER_TEMP/load-balance-native-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-load-balance-c112/bootstrap-original-install.py "$RUNNER_TEMP/load-balance-native-inputs" "$RUNNER_TEMP/load-balance-native-private" > "$RUNNER_TEMP/load-balance-native-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/load-balance-native-private/bootstrap-step.stderr"
      - name: Install Nginx and verify real signed TCP and UDP traffic
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-load-balance-c112/load-balance-native.py "$RUNNER_TEMP/load-balance-native-private" > "$RUNNER_TEMP/load-balance-native-private/load-balance-native-step.stdout" 2> "$RUNNER_TEMP/load-balance-native-private/load-balance-native-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-load-balance-c112/finish.py "$RUNNER_TEMP/load-balance-native-private" "$RUNNER_TEMP/load-balance-native-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c112-native-load-balance-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/load-balance-native-public/
          if-no-files-found: error
          retention-days: 14
