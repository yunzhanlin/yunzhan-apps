name: Native PHP 7.0 through 7.3 engine backport compatibility
on:
  push:
    branches: [codex/php70-73-c96-security-native]
    paths: [scripts/php-c96/proof.sh]
permissions:
  contents: read
jobs:
  native-php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php:
          - { slot: '70', version: '7.0.33' }
          - { slot: '71', version: '7.1.33' }
          - { slot: '72', version: '7.2.34' }
          - { slot: '73', version: '7.3.33' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the reviewed PHP source and execute HTTP, uploads and restart
        env:
          PHP_SLOT: ${{ matrix.php.slot }}
          PHP_VERSION: ${{ matrix.php.version }}
        run: |
          set -euo pipefail
          bash scripts/php-c96/proof.sh "$PHP_SLOT" "$PHP_VERSION"
          bash scripts/php-c96/database.sh "$PHP_VERSION"
      - name: Retain original observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c96-php-${{ matrix.php.slot }}-http-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c96-php-proof/
          if-no-files-found: error
          retention-days: 14
