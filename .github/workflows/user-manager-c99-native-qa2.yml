name: Signed account permissions on native Linux
on:
  push:
    branches: [codex/user-manager-c99-native-qa2]
    paths: [scripts/native-user-manager-c99/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  user-manager:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-user-manager-c99/download.py "$RUNNER_TEMP/user-manager-inputs" "$RUNNER_TEMP/user-manager-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-user-manager-c99/bootstrap-original-install.py "$RUNNER_TEMP/user-manager-inputs" "$RUNNER_TEMP/user-manager-private" > "$RUNNER_TEMP/user-manager-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/user-manager-private/bootstrap-step.stderr"
      - name: Verify actual account scope, login, and session revocation
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-user-manager-c99/user-manager.py "$RUNNER_TEMP/user-manager-private" > "$RUNNER_TEMP/user-manager-private/user-manager-step.stdout" 2> "$RUNNER_TEMP/user-manager-private/user-manager-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-user-manager-c99/finish.py "$RUNNER_TEMP/user-manager-private" "$RUNNER_TEMP/user-manager-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c99-native-user-manager-qa2-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/user-manager-public/
          if-no-files-found: error
          retention-days: 14
