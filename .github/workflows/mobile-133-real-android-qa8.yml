name: C68 original API37 real panel file download and system provider QA8
on:
  push:
    branches: [codex/mobile-native-download-c68]
    paths: ['qa/native-mobile133/**', '.github/workflows/mobile-133-real-android-qa8.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: c68-original-real-Android-qa8-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-API37-real-file-management:
    env:
      C68_UI_COHORT: QA8
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Require immutable native source and preserve original server SDK
        run: |
          git fetch --no-tags --depth=1 origin 5f8457971e3ca4868d85c70d3f854d5773f25c8f
          node --test tests/mobile-client-133.test.mjs
      - name: Acquire original signed programme and the completed original source CI APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/c68-private" "$RUNNER_TEMP/c68-public"
          python3 -I -B qa/native-mobile133/download-programme.py "$RUNNER_TEMP/c68-assets"
          python3 -I -B qa/native-mobile133/download-original-APK.py "$RUNNER_TEMP/c68-private"
      - name: Prepare the exact official Android37 system image and owned KVM access
        run: |
          set -eu
          umask 077
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'system-images;android-37.0;default;x86_64' 'emulator' 'platform-tools' > "$RUNNER_TEMP/c68-private/SDK-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/SDK-preparation.stderr"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - name: One normal original signed fresh Linux install and real owned file-management site
        run: |
          set -eu
          umask 077
          sudo -n env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B qa/native-mobile133/prepare-real-panel.py "$RUNNER_TEMP/c68-assets" "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/real-panel-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/real-panel-preparation.stderr"
      - name: Boot one isolated emulator and install only original proven APK bytes
        run: |
          set -eu
          umask 077
          python3 -I -B qa/native-mobile133/start-owned-emulator.py "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/emulator-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/emulator-preparation.stderr"
      - name: Independent platform storage diagnosis inside the test-signed original release sandbox
        run: |
          set -eu
          umask 077
          python3 -I -B qa/native-mobile133/probe-original-release-storage.py "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/platform-probe-step.stdout" 2> "$RUNNER_TEMP/c68-private/platform-probe-step.stderr"
      - name: Actual native controls real login download provider readback privacy and stale OS results
        run: |
          set -eu
          umask 077
          python3 -I -B qa/native-mobile133/android-real-ui.py "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/device-UI.stdout" 2> "$RUNNER_TEMP/c68-private/device-UI.stderr"
          node --test tests/mobile-client-133.test.mjs
      - name: Preserve original failures and independently reconcile the real attachment then seal evidence
        if: always()
        run: |
          set -eu
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/c68-private" "$RUNNER_TEMP/c68-public"
          sudo -n env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B qa/native-mobile133/finish-evidence.py "$RUNNER_TEMP/c68-private" "$RUNNER_TEMP/c68-public"
      - name: Stop only this disposable owned emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/c68-private/owned-emulator-intent.json" ]; then
            "${ANDROID_HOME:?}/platform-tools/adb" -s emulator-5554 emu kill
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c68-original-real-Android-API37-QA8-${{ github.run_id }}
          path: ${{ runner.temp }}/c68-public/
          retention-days: 14
          if-no-files-found: error
