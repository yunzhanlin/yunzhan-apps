name: Docker C290 current native Linux contracts
on:
  push:
    branches: [codex/docker-c290-native-unit]
    paths: [.github/workflows/docker-c290-native-unit.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify exact current signed programme SDK
        run: |
          mkdir -p "$RUNNER_TEMP/c290-original"
          python3 -I -B scripts/qa-apache-c265/verify-inputs.py > "$RUNNER_TEMP/c290-original/source-proof.json"
      - name: Native current Core and Root Docker and retired PHP admission contracts
        working-directory: candidate/panel-integration-compose-signed-image
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: |
          set -euo pipefail
          go test ./internal/appcatalog ./internal/core -run 'Docker|Compose|RetiredPHP' -count=1 -v > "$RUNNER_TEMP/c290-original/core-and-catalogue.stdout" 2>&1
          go test -c ./internal/executor -o "$RUNNER_TEMP/c290-original/executor.test"
          sha256sum "$RUNNER_TEMP/c290-original/executor.test" > "$RUNNER_TEMP/c290-original/executor-test.sha256"
          sudo "$RUNNER_TEMP/c290-original/executor.test" -test.run 'Docker|Compose|RetiredPHP' -test.v -test.timeout 300s > "$RUNNER_TEMP/c290-original/root-native-filesystem.stdout" 2>&1
          rm "$RUNNER_TEMP/c290-original/executor.test"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c290-docker-native-unit-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c290-original/
          if-no-files-found: error
          retention-days: 14
