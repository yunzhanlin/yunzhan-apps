name: Signed daily report scheduling on native Linux
on:
  push:
    branches: [codex/daily-report-schedule-c108-native-qa1]
    paths: [scripts/native-daily-report-schedule-c108/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  daily-report-schedule:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-daily-report-schedule-c108/download.py "$RUNNER_TEMP/daily-report-schedule-inputs" "$RUNNER_TEMP/daily-report-schedule-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-daily-report-schedule-c108/bootstrap-original-install.py "$RUNNER_TEMP/daily-report-schedule-inputs" "$RUNNER_TEMP/daily-report-schedule-private" > "$RUNNER_TEMP/daily-report-schedule-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/daily-report-schedule-private/bootstrap-step.stderr"
      - name: Verify the report calendar and actual worker
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-daily-report-schedule-c108/daily-report-schedule.py "$RUNNER_TEMP/daily-report-schedule-private" > "$RUNNER_TEMP/daily-report-schedule-private/daily-report-schedule-step.stdout" 2> "$RUNNER_TEMP/daily-report-schedule-private/daily-report-schedule-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-daily-report-schedule-c108/finish.py "$RUNNER_TEMP/daily-report-schedule-private" "$RUNNER_TEMP/daily-report-schedule-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c108-native-daily-report-schedule-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-report-schedule-public/
          if-no-files-found: error
          retention-days: 14
