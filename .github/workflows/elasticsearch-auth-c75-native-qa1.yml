name: Signed Elasticsearch credentials and data-preserving restart
on:
  push:
    branches: [codex/elasticsearch-auth-c75-native-qa1]
    paths: [scripts/native-elasticsearch-c75/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  elasticsearch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download the exact signed baseline and upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-elasticsearch-c75/download.py "$RUNNER_TEMP/es-old" "$RUNNER_TEMP/es-new" "$RUNNER_TEMP/es-private"
      - name: Install the original signed panel
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-elasticsearch-c75/bootstrap-original-install.py "$RUNNER_TEMP/es-old" "$RUNNER_TEMP/es-private" > "$RUNNER_TEMP/es-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/es-private/bootstrap-step.stderr"
      - name: Verify Elasticsearch authentication, indexed data, restart and upgrade preservation
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-elasticsearch-c75/elasticsearch.py "$RUNNER_TEMP/es-private" "$RUNNER_TEMP/es-new" > "$RUNNER_TEMP/es-private/elasticsearch-step.stdout" 2> "$RUNNER_TEMP/es-private/elasticsearch-step.stderr"
      - name: Prepare independently pinned native Chromium
        run: |
          umask 077
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/native-elasticsearch-c75
          apt_config="$(sudo python3 -I -B -c 'import json,sys;print(json.load(open(sys.argv[1]))["path"])' "$RUNNER_TEMP/es-private/isolated-ubuntu-apt-config.json")"
          sudo env APT_CONFIG="$apt_config" "$(command -v node)" scripts/native-elasticsearch-c75/node_modules/playwright-core/cli.js install-deps chromium > "$RUNNER_TEMP/es-private/browser-dependencies.stdout" 2> "$RUNNER_TEMP/es-private/browser-dependencies.stderr"
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-elasticsearch-c75/prepare-browser.py "$RUNNER_TEMP/c75-chromium.zip" "$RUNNER_TEMP/es-private" > "$RUNNER_TEMP/es-private/browser-prepare.stdout" 2> "$RUNNER_TEMP/es-private/browser-prepare.stderr"
      - name: Verify the real Elasticsearch credentials dialog
        run: |
          umask 077
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/es-private/business-phase1/original-proof.json"
          sudo chmod 711 "$RUNNER_TEMP/es-private/business-phase1"
          node scripts/native-elasticsearch-c75/browser.mjs "$RUNNER_TEMP/es-private" > "$RUNNER_TEMP/es-private/browser-step.stdout" 2> "$RUNNER_TEMP/es-private/browser-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-elasticsearch-c75/finish.py "$RUNNER_TEMP/es-private" "$RUNNER_TEMP/es-public" phase1
      - name: Retain the native outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c75-elasticsearch-native-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/es-public/
          if-no-files-found: error
          retention-days: 14
