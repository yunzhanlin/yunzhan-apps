name: Daily Report current native TLS SMTP and durable retry contract
on:
  push:
    branches: [codex/daily-report-c253-current-smtp-native]
    paths: [scripts/native-pm2-c230/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact original signed programme and fixture inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-pm2-c230/download.py "$RUNNER_TEMP/user-inputs" "$RUNNER_TEMP/user-private"
      - name: Normal original signed programme installation on owned fresh host
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/bootstrap-original-install.py "$RUNNER_TEMP/user-inputs" "$RUNNER_TEMP/user-private" > "$RUNNER_TEMP/user-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/user-private/bootstrap-step.stderr"
      - name: Actual own loopback TLS SMTP retries certificate refusal and data preservation
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/daily-smtp-current-business.py "$RUNNER_TEMP/user-private" > "$RUNNER_TEMP/user-private/business-step.stdout" 2> "$RUNNER_TEMP/user-private/business-step.stderr"
      - name: Preserve encrypted original evidence including failures
        if: always()
        run: sudo python3 -I -B scripts/native-pm2-c230/finish.py "$RUNNER_TEMP/user-private" "$RUNNER_TEMP/user-public" phase1
      - name: Upload original encrypted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c253-daily-smtp-current-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/user-public/
          if-no-files-found: error
          retention-days: 14
