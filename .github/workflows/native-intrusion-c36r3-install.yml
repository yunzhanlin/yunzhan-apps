name: actual native C36r3 QA1 AMD64 Ubuntu24 automatic first-install SSH policy and signed Anti-intrusion111

on:
  push:
    branches: [codex/app-candidate]
    paths:
      # An immutable publication marker is added only after the reviewed QA cohort is published.
      - scripts/native-intrusion-c36r3/dispatch.json

permissions:
  contents: read

concurrency:
  group: native-intrusion-c36r3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the complete published original-key QA cohort without guest credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c36r3-assets"
          ready=false
          for attempt in $(seq 1 90); do
            if gh release view qa-nfsreportcandidate36r3-20261030-qa1 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/country-release-status.json" 2>/dev/null && python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["isDraft"] is False and v["isPrerelease"] is True else 1)' "$RUNNER_TEMP/country-release-status.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          gh release download qa-nfsreportcandidate36r3-20261030-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-intrusion-c36r3-assets"
          python3 - "$RUNNER_TEMP/native-intrusion-c36r3-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '07e9f6d7e67dda81f1d756f91f9fbffd597e40077a28ea8a351a2053f0f779be'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == '1d9910740e082833fb4e5156fc6baf2e2b977bc67efc865ec6ee4a3ebc425f25'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Original-key C35 programme and exact shared native app QA verified; no credentials in guest payload')
          PY
      - name: Root first-install policy, actual assembled helper and existing WAF packaging fixtures
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          assert hashlib.sha256(pathlib.Path('candidate/panel-integration-load-balance/scripts/upgrade-running-development.sh').read_bytes()).hexdigest() == 'b116481c2a3d4e95922884d10f4baeb5ed4a828d902231fb0202eb25a9da8695'
          assert hashlib.sha256(pathlib.Path('candidate/panel-integration-load-balance/dev/provision-app.sh').read_bytes()).hexdigest() == '05961d8bdce8e5b7e960962a47167a936922b827844c31f0757656b5168bc8c6'
          PY
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_fresh_ssh_policy.py
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_apache_body_cache_budget.py
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_waf_state_directory.py
      - name: Prepare hardware guest tools while preserving existing host services
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Fresh Ubuntu24 signed C36r3, real dualstack SSH enforcement, preserving configure and audited unban
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c36r3-public"
          sudo -n python3 -I -B scripts/native-intrusion-c36r3/kvm.py "$RUNNER_TEMP/native-intrusion-c36r3-assets" scripts/native-intrusion-c36r3 "$RUNNER_TEMP/native-intrusion-c36r3-public"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-intrusion-c36r3-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-intrusion-c36r3-public/
          retention-days: 7
          if-no-files-found: warn
