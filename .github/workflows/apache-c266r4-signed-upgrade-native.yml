name: Apache C266r4 original signed old-to-new runtime WAF and cold acceptance
on:
  push:
    branches: [codex/apache-c266r4-signed-upgrade-native]
    paths: [scripts/native-apache-c266r4/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c266-apache-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/apache-c266r4-signed-upgrade-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        system: [ubuntu22, debian13]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-apache-c266r4
      - name: Download the exact original signed programme cohorts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-apache-c266r4
          root="$RUNNER_TEMP/apache-c266r4-signed"
          mkdir -m 700 "$root"
          old=$(jq -r '.previous_tag' "$fixture/dispatch.json")
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$old" = qa-pm2archivecandidate232r2-20261120-qa1
          test "$tag" = qa-apache271candidate265r5-20261121-qa1
          gh release download "$old" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          for f in guest.py casebook.py archive_acceptance.py acceptance_old.py acceptance_target.py; do cp "$fixture/$f" "$root/$f"; done
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware virtualization
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual original signed Apache WAF runtime upgrade and hard cold recovery
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/apache-c266r4-public"
          sudo -n python3 -I -B scripts/native-apache-c266r4/kvm.py "$RUNNER_TEMP/apache-c266r4-signed" scripts/native-apache-c266r4 "$RUNNER_TEMP/apache-c266r4-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c266r4-apache-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-c266r4-public/
          retention-days: 14
          if-no-files-found: warn
