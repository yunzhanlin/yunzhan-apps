name: PHP 8.0.30 isolated native image
on:
  push:
    branches: [codex/php8030-c80-image-qa1]
    paths: [apps/php-80/image/Dockerfile]
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and run PHP-FPM with Nginx and persistent data
        run: bash apps/php-80/image/native.sh "$RUNNER_TEMP/php8030-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c80-php8030-image-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/php8030-proof/
          if-no-files-found: error
          retention-days: 14
