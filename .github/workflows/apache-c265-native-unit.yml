name: Apache C265 reviewed runtime native Linux unit contracts
on:
  push:
    branches: [codex/apache-c265-upgrade-native, codex/apache-c265r6-ui-native]
    paths: [candidate/panel-integration-compose-signed-image/**, scripts/qa-apache-c265/**, .github/workflows/apache-c265-native-unit.yml]
permissions:
  contents: read
jobs:
  native-unit:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify exact frozen SDK bytes before native execution
        run: |
          mkdir -p "$RUNNER_TEMP/c265-original"
          python3 -I -B scripts/qa-apache-c265/verify-inputs.py > "$RUNNER_TEMP/c265-original/source-proof.json"
      - name: Native unit fixtures for immutable runtime selection and complete configuration recovery
        working-directory: candidate/panel-integration-compose-signed-image
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: |
          set -euo pipefail
          go build ./cmd/... > "$RUNNER_TEMP/c265-original/programme-build.stdout" 2>&1
          go test ./internal/runtimecatalog ./internal/core ./cmd/executor -run 'TestApache(Runtime|Committed|BodyLoader|Security)|TestExecutorCLI' -count=1 -v > "$RUNNER_TEMP/c265-original/core-and-catalogue.stdout" 2>&1
          go test -c ./internal/executor -o "$RUNNER_TEMP/c265-original/executor.test"
          sha256sum "$RUNNER_TEMP/c265-original/executor.test" > "$RUNNER_TEMP/c265-original/executor-test.sha256"
          sudo "$RUNNER_TEMP/c265-original/executor.test" -test.run '^(TestApacheRuntime|TestApacheCommitted|TestApacheBodyLoader|TestApacheWAFHistory)' -test.v -test.timeout 180s > "$RUNNER_TEMP/c265-original/root-native-filesystem.stdout" 2>&1
          rm "$RUNNER_TEMP/c265-original/executor.test"
      - name: Preserve original native unit receipts including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c265-apache-native-unit-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c265-original/
          if-no-files-found: error
          retention-days: 14
