name: actual C52 Debian12 writer contention with bounded read-only observation

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - scripts/native-apache-c52/dispatch.json

permissions:
  contents: read

concurrency:
  group: native-apache-c52-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os_case: [debian12]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the original reviewed signed cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-apache-c52-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/431102346 > "$RUNNER_TEMP/cohort.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["id"]==431102346 and not v["draft"] and v["prerelease"] and v["tag_name"]=="qa-apachewriterbusycandidate52-20261102-qa1" and len(v["assets"])==7' "$RUNNER_TEMP/cohort.json"
          gh release download qa-apachewriterbusycandidate52-20261102-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-apache-c52-assets"
          cp scripts/native-apache-c52/guest.py scripts/native-apache-c52/capture.py scripts/native-apache-c52/casebook.py "$RUNNER_TEMP/native-apache-c52-assets/"
          cp candidate/panel-integration-load-balance/packaging/signed-release.py "$RUNNER_TEMP/native-apache-c52-assets/"
          cp scripts/native-apache-c52/payload.json "$RUNNER_TEMP/native-apache-c52-assets/assets.json"
          python3 - "$RUNNER_TEMP/native-apache-c52-assets" <<'PY'
          import ast,hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base/'assets.json').read_bytes()).hexdigest()=='f055ac86ae47fd6e504ca02e1e074a385d8dbbf27cf26348181176e8b6ab0c7d'
          manifest=json.loads((base/'assets.json').read_bytes())
          assert manifest['source_inputs_sha256']=='44fa6a9522dbf207647c5664d05fbfbdc9f348e4bd2b66560373e1140805ba72'
          for name,digest in manifest['files'].items():
              assert pathlib.PurePath(name).name==name
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest
          signer_pin_expression=ast.dump(ast.parse("sha(payload / 'signed-release.py')",mode='eval').body)
          signer_pins=[]
          for node in ast.walk(ast.parse((base/'guest.py').read_bytes())):
              if isinstance(node,ast.Assert) and isinstance(node.test,ast.Compare) and ast.dump(node.test.left)==signer_pin_expression:
                  assert len(node.test.ops)==len(node.test.comparators)==1 and isinstance(node.test.ops[0],ast.Eq) and isinstance(node.test.comparators[0],ast.Constant)
                  signer_pins.append(node.test.comparators[0].value)
          assert signer_pins==[manifest['files']['signed-release.py']]
          print('Original programme signatures, key and reviewed QA payload bound')
          PY
      - name: Prepare actual hardware guest tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Original signed C52 install, Apache PHP native accounts,4168 actual requests, manual log maintenance and actual BSD writer contention plus next minute completion
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-apache-c52-public"
          sudo -n python3 -I -B scripts/native-apache-c52/kvm.py "$RUNNER_TEMP/native-apache-c52-assets" scripts/native-apache-c52 "$RUNNER_TEMP/native-apache-c52-public" "$OS_CASE"
      - name: Retain public proof and encrypted original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-apache-c52-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-apache-c52-public/
          retention-days: 7
          if-no-files-found: warn
