name: Observe original anonymous store HTTPS transport in runner and service environments
on:
  push:
    branches: [codex/store-transport-c67-qa1]
    paths: [tools/observe-original-store-transport-c67.go, .github/workflows/store-transport-c67.yml]
permissions:
  contents: read
concurrency:
  group: c67-store-transport-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-readonly-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Build only a standard library observer and keep original outcomes
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/store-transport-original"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/store-transport-original/observer" tools/observe-original-store-transport-c67.go
          "$RUNNER_TEMP/store-transport-original/observer" > "$RUNNER_TEMP/store-transport-original/original-runner.json"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin "$RUNNER_TEMP/store-transport-original/observer" > "$RUNNER_TEMP/store-transport-original/original-clean-service-env.json"
          set +e
          curl --silent --show-error --connect-timeout 10 --max-time 15 --output /dev/null --write-out '%{http_code} %{ssl_verify_result}\n' 'https://api.github.com/repos/yunzhanlin/yunzhan-apps/git/ref/heads/codex/app-candidate' > "$RUNNER_TEMP/store-transport-original/original-curl-status.txt" 2> "$RUNNER_TEMP/store-transport-original/original-curl.stderr"
          original_curl_exit=$?
          set -e
          echo "$original_curl_exit" > "$RUNNER_TEMP/store-transport-original/original-curl-exit.txt"
          git diff --exit-code -- candidate/panel-integration-load-balance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c67-original-readonly-store-transport-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/store-transport-original/original-*
          if-no-files-found: error
          retention-days: 7
