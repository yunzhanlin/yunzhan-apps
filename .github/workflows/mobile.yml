name: Native mobile client
on:
  push:
    paths: ['native-client-1.3.1/**', '.github/workflows/mobile.yml', 'tests/mobile-native-session.test.mjs', 'registry/mobile-native-session-release.json']
  pull_request:
    paths: ['native-client-1.3.1/**', '.github/workflows/mobile.yml', 'tests/mobile-native-session.test.mjs', 'registry/mobile-native-session-release.json']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Actual Android debug and release contracts, APK compilation and lint (not physical device proof)
        working-directory: native-client-1.3.1/mobile/android
        run: gradle --no-daemon test assembleRelease assembleDebug lint
      - uses: actions/upload-artifact@v7
        with:
          name: yunzhan-mobile-1.3.1-UNSIGNED-android
          path: native-client-1.3.1/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Exact native origin and session-state contracts (not physical device proof)
        working-directory: native-client-1.3.1/mobile/ios
        run: swift test
      - name: Actual unsigned iOS arm64 device build without developer credentials
        working-directory: native-client-1.3.1/mobile/ios
        run: xcodebuild -quiet -project YunzhanMobile.xcodeproj -scheme YunzhanMobile -configuration Release -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/yunzhan-mobile-1.3.1" CODE_SIGNING_ALLOWED=NO build
      - name: Preserve actual unsigned bundle permissions
        run: tar -czf "$RUNNER_TEMP/yunzhan-mobile-1.3.1-UNSIGNED-ios.tar.gz" -C "$RUNNER_TEMP/yunzhan-mobile-1.3.1/Build/Products/Release-iphoneos" YunzhanMobile.app
      - uses: actions/upload-artifact@v7
        with:
          name: yunzhan-mobile-1.3.1-UNSIGNED-ios
          path: ${{ runner.temp }}/yunzhan-mobile-1.3.1-UNSIGNED-ios.tar.gz
          if-no-files-found: error
