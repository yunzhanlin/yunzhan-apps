name: Native PHP 8.1 engine backport compatibility
on:
  push:
    branches: [codex/php81-c93-security-native]
    paths: [scripts/php81-c93/Dockerfile]
permissions:
  contents: read
jobs:
  native-php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the reviewed PHP source and execute HTTP, uploads and restart
        run: bash scripts/php81-c93/proof.sh
      - name: Retain original observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c93-php81-http-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c93-php81-proof/
          if-no-files-found: error
          retention-days: 14
