name: Signed website analytics compatibility on native Linux
on:
  push:
    branches: [codex/analytics-period-comparison-c105r3-native-qa1]
    paths: [scripts/native-analytics-period-comparison-c105r3/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  analytics-period-comparison:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-analytics-period-comparison-c105r3/download.py "$RUNNER_TEMP/analytics-period-comparison-inputs" "$RUNNER_TEMP/analytics-period-comparison-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-analytics-period-comparison-c105r3/bootstrap-original-install.py "$RUNNER_TEMP/analytics-period-comparison-inputs" "$RUNNER_TEMP/analytics-period-comparison-private" > "$RUNNER_TEMP/analytics-period-comparison-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/analytics-period-comparison-private/bootstrap-step.stderr"
      - name: Verify the original website analytics collector and report
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-analytics-period-comparison-c105r3/analytics-period-comparison.py "$RUNNER_TEMP/analytics-period-comparison-private" > "$RUNNER_TEMP/analytics-period-comparison-private/analytics-period-comparison-step.stdout" 2> "$RUNNER_TEMP/analytics-period-comparison-private/analytics-period-comparison-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-analytics-period-comparison-c105r3/finish.py "$RUNNER_TEMP/analytics-period-comparison-private" "$RUNNER_TEMP/analytics-period-comparison-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c105r3-native-analytics-period-comparison-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/analytics-period-comparison-public/
          if-no-files-found: error
          retention-days: 14
