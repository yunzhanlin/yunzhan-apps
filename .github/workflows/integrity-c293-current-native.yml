name: Current signed integrity kernel ownership and original records
on:
  push:
    branches: [codex/integrity-c293-native-business]
    paths: [scripts/native-integrity-c293/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  docker:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original signed programme and exact fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-integrity-c293/download.py "$RUNNER_TEMP/integrity-c293-inputs" "$RUNNER_TEMP/integrity-c293-private"
      - name: Install exact original signed programme
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-integrity-c293/bootstrap-original-install.py "$RUNNER_TEMP/integrity-c293-inputs" "$RUNNER_TEMP/integrity-c293-private" > "$RUNNER_TEMP/integrity-c293-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/integrity-c293-private/bootstrap-step.stderr"
      - name: Actual signed website and enterprise kernel protection and service restart
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-integrity-c293/integrity-business.py "$RUNNER_TEMP/integrity-c293-private" > "$RUNNER_TEMP/integrity-c293-private/docker-step.stdout" 2> "$RUNNER_TEMP/integrity-c293-private/docker-step.stderr"
      - name: Encrypt complete original evidence including failures
        if: always()
        run: sudo python3 -I -B scripts/native-integrity-c293/finish.py "$RUNNER_TEMP/integrity-c293-private" "$RUNNER_TEMP/integrity-c293-public" phase1
      - name: Upload encrypted originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c293-native-integrity-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/integrity-c293-public/
          if-no-files-found: error
          retention-days: 14
