name: Build and verify PHP52/53 Hash compatibility images
on:
  push:
    branches: [codex/legacy-php-hash-c223-images]
    paths: [scripts/legacy-hash-c223/cohort.json]
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        php:
          - {version: '5.2.17', slot: '52'}
          - {version: '5.3.29', slot: '53'}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact original build inputs and intended patch
        run: python3 -I -B scripts/legacy-hash-c223/verify.py
      - name: Build native source, HTTP Hash, retained data and database round trip
        env:
          PHP_VERSION: ${{ matrix.php.version }}
          PHP_SLOT: ${{ matrix.php.slot }}
        run: |
          set -euo pipefail
          umask 077
          bash scripts/legacy-hash-c223/native.sh "$RUNNER_TEMP/php-proof" "$PHP_VERSION" "$PHP_SLOT"
          bash scripts/legacy-hash-c223/database.sh "$RUNNER_TEMP/php-proof"
          python3 -I -B scripts/legacy-hash-c223/hash-probe.py "$RUNNER_TEMP/php-proof" "$PHP_VERSION"
      - name: Publish only exact tested new architecture tag
        env:
          PACKAGE_TOKEN: ${{ github.token }}
          PHP_VERSION: ${{ matrix.php.version }}
          PHP_SLOT: ${{ matrix.php.slot }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/registry-auth.XXXXXX")"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset PACKAGE_TOKEN
          python3 -I -B scripts/legacy-hash-c223/publish.py "$RUNNER_TEMP/php-proof" "$PHP_VERSION" "$PHP_SLOT"
      - name: Preserve original build and runtime outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c223-hash-${{ matrix.php.slot }}-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/php-proof/
          if-no-files-found: error
          retention-days: 14
