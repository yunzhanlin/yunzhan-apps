name: Native mobile client 1.3.2
on:
  push:
    paths: ['native-client-1.3.2/**', '.github/workflows/mobile-132.yml', 'tools/check-mobile-132-results.py', 'tools/export-mobile-client-132-source.mjs', 'tests/mobile-client-132.test.mjs', 'registry/mobile-native-132-qualification.json']
  pull_request:
    paths: ['native-client-1.3.2/**', '.github/workflows/mobile-132.yml', 'tools/check-mobile-132-results.py', 'tools/export-mobile-client-132-source.mjs', 'tests/mobile-client-132.test.mjs', 'registry/mobile-native-132-qualification.json']
permissions:
  contents: read
jobs:
  android132:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'
      - name: Exact immutable source and capability boundaries
        run: node --test tests/mobile-client-132.test.mjs
      - name: Actual Android models, APK builds and strict lint in both variants
        working-directory: native-client-1.3.2/mobile/android
        run: gradle --no-daemon --max-workers=2 test assembleRelease assembleDebug lintDebug lintRelease
      - name: Parse actual JUnit and XML lint records, including multiline issue elements
        run: python3 tools/check-mobile-132-results.py --android native-client-1.3.2/mobile/android
      - name: Source bytes remain unchanged after native execution
        run: node --test tests/mobile-client-132.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yunzhan-mobile-1.3.2-UNSIGNED-android
          path: native-client-1.3.2/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
  ios132:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Actual Xcode toolchain on this runner
        run: xcodebuild -version
      - name: Exact immutable source and capability boundaries
        run: node --test tests/mobile-client-132.test.mjs
      - name: Native origin, connection, picker, authentication and one-shot dialog models
        working-directory: native-client-1.3.2/mobile/ios
        run: |
          set -o pipefail
          swift test --jobs 2 2>&1 | tee "$RUNNER_TEMP/yunzhan-mobile-1.3.2-swift.log"
      - name: Unsigned arm64 device build; no developer credential or signing permission
        working-directory: native-client-1.3.2/mobile/ios
        run: xcodebuild -quiet -project YunzhanMobile.xcodeproj -scheme YunzhanMobile -configuration Release -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/yunzhan-mobile-1.3.2" -jobs 2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify actual tests, bundle version, arm64 and unsigned state
        run: python3 tools/check-mobile-132-results.py --swift-log "$RUNNER_TEMP/yunzhan-mobile-1.3.2-swift.log" --ios-bundle "$RUNNER_TEMP/yunzhan-mobile-1.3.2/Build/Products/Release-iphoneos/YunzhanMobile.app"
      - name: Source bytes remain unchanged after native execution
        run: node --test tests/mobile-client-132.test.mjs
      - name: Preserve actual unsigned bundle permissions
        run: tar -czf "$RUNNER_TEMP/yunzhan-mobile-1.3.2-UNSIGNED-ios.tar.gz" -C "$RUNNER_TEMP/yunzhan-mobile-1.3.2/Build/Products/Release-iphoneos" YunzhanMobile.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yunzhan-mobile-1.3.2-UNSIGNED-ios
          path: ${{ runner.temp }}/yunzhan-mobile-1.3.2-UNSIGNED-ios.tar.gz
          if-no-files-found: error
