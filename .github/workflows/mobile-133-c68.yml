name: Native mobile 1.3.3 immutable source and original platform builds
on:
  push:
    branches: [codex/mobile-native-download-c68]
    paths: ['native-client-1.3.3/**', '.github/workflows/mobile-133-c68.yml', 'tools/check-mobile-133-results.py', 'tests/mobile-client-133.test.mjs', 'registry/mobile-native-133-local-build-qualification.json']
permissions:
  contents: read
concurrency:
  group: c68-native-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-Android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '9.3.1'
      - name: Verify actual source and preserve prior server and client inputs
        run: node --test tests/mobile-client-133.test.mjs
      - name: Install exact official Android platform and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Execute both variants and strict lint with no empty test allowance
        working-directory: native-client-1.3.3/mobile/android
        run: gradle --no-daemon --max-workers=2 --rerun-tasks --console=plain testDebugUnitTest testReleaseUnitTest assembleRelease assembleDebug lintDebug lintRelease
      - name: Independently parse all actual JUnit and XML lint outputs
        run: python3 -I -B tools/check-mobile-133-results.py --android native-client-1.3.3/mobile/android
      - name: Recheck source bytes after execution
        run: node --test tests/mobile-client-133.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c68-original-Android-native133-${{ github.run_id }}
          path: |
            native-client-1.3.3/mobile/android/app/build/test-results/
            native-client-1.3.3/mobile/android/app/build/reports/lint-results-*.xml
            native-client-1.3.3/mobile/android/app/build/outputs/apk/
          retention-days: 14
          if-no-files-found: error
  original-iOS:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify actual source and preserve prior server and client inputs
        run: node --test tests/mobile-client-133.test.mjs
      - name: Run original Foundation transport cache metadata and ownership tests
        working-directory: native-client-1.3.3/mobile/ios
        run: |
          set -o pipefail
          swift test --jobs 2 2>&1 | tee "$RUNNER_TEMP/c68-original-Swift.log"
      - name: Compile original arm64 device bundle without signing credentials
        working-directory: native-client-1.3.3/mobile/ios
        run: xcodebuild -quiet -project YunzhanMobile.xcodeproj -scheme YunzhanMobile -configuration Release -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/c68-original-iOS" -jobs 2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Independently require all original tests architecture and unsigned state
        run: python3 -I -B tools/check-mobile-133-results.py --swift-log "$RUNNER_TEMP/c68-original-Swift.log" --ios-bundle "$RUNNER_TEMP/c68-original-iOS/Build/Products/Release-iphoneos/YunzhanMobile.app"
      - name: Recheck source bytes after execution
        run: node --test tests/mobile-client-133.test.mjs
      - name: Preserve unsigned device bundle permissions
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/c68-original-iOS/Build/Products/Release-iphoneos/YunzhanMobile.app" ]; then
            tar -czf "$RUNNER_TEMP/c68-original-iOS-unsigned.tar.gz" -C "$RUNNER_TEMP/c68-original-iOS/Build/Products/Release-iphoneos" YunzhanMobile.app
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c68-original-iOS-native133-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/c68-original-Swift.log
            ${{ runner.temp }}/c68-original-iOS-unsigned.tar.gz
          retention-days: 14
          if-no-files-found: error
