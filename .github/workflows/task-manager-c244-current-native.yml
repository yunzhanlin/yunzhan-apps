name: Current signed Task Manager real process and lifecycle contract
on:
  push:
    branches: [codex/task-manager-c244-current-native]
    paths: [scripts/native-pm2-c230/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original signed programme and exact fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-pm2-c230/download.py "$RUNNER_TEMP/task-inputs" "$RUNNER_TEMP/task-private"
      - name: Normal original signed programme first installation
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/bootstrap-original-install.py "$RUNNER_TEMP/task-inputs" "$RUNNER_TEMP/task-private" > "$RUNNER_TEMP/task-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/task-private/bootstrap-step.stderr"
      - name: Protect owned disposable image share directory before dependency build
        run: sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/prepare-pm2-host.py "$RUNNER_TEMP/task-private"
      - name: Real own managed process signal identity and retained lifecycle business
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/task-current-business.py "$RUNNER_TEMP/task-private" > "$RUNNER_TEMP/task-private/business-step.stdout" 2> "$RUNNER_TEMP/task-private/business-step.stderr"
      - name: Retain encrypted complete original evidence including failures
        if: always()
        run: sudo python3 -I -B scripts/native-pm2-c230/finish.py "$RUNNER_TEMP/task-private" "$RUNNER_TEMP/task-public" phase1
      - name: Upload encrypted originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c244-task-manager-current-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/task-public/
          if-no-files-found: error
          retention-days: 14
