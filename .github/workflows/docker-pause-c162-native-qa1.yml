name: Docker container pause and resume on native Linux
on:
  push:
    branches: [codex/docker-pause-c162-native-qa1]
    paths: [scripts/native-docker-container-metrics-c106r3/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  docker-container-metrics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-docker-container-metrics-c106r3/download.py "$RUNNER_TEMP/docker-container-metrics-inputs" "$RUNNER_TEMP/docker-container-metrics-private"
      - name: Preserve the hosted image Docker state and prepare a clean test
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" python3 -I -B scripts/native-docker-container-metrics-c106r3/prepare-fresh-docker.py "$RUNNER_TEMP/docker-container-metrics-private" > "$RUNNER_TEMP/docker-container-metrics-private/docker-preparation.stdout" 2> "$RUNNER_TEMP/docker-container-metrics-private/docker-preparation.stderr"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-docker-container-metrics-c106r3/bootstrap-original-install.py "$RUNNER_TEMP/docker-container-metrics-inputs" "$RUNNER_TEMP/docker-container-metrics-private" > "$RUNNER_TEMP/docker-container-metrics-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/docker-container-metrics-private/bootstrap-step.stderr"
      - name: Pause and resume the same real container
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-docker-container-metrics-c106r3/docker-container-metrics.py "$RUNNER_TEMP/docker-container-metrics-private" > "$RUNNER_TEMP/docker-container-metrics-private/docker-container-metrics-step.stdout" 2> "$RUNNER_TEMP/docker-container-metrics-private/docker-container-metrics-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-docker-container-metrics-c106r3/finish.py "$RUNNER_TEMP/docker-container-metrics-private" "$RUNNER_TEMP/docker-container-metrics-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c162-native-docker-pause-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-container-metrics-public/
          if-no-files-found: error
          retention-days: 14
