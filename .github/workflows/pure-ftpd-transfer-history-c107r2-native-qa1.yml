name: Signed FTPS transfer history on native Linux
on:
  push:
    branches: [codex/pure-ftpd-transfer-history-c107r2-native-qa1]
    paths: [scripts/native-pure-ftpd-transfer-history-c107r2/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  pure-ftpd-transfer-history:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-pure-ftpd-transfer-history-c107r2/download.py "$RUNNER_TEMP/pure-ftpd-transfer-history-inputs" "$RUNNER_TEMP/pure-ftpd-transfer-history-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pure-ftpd-transfer-history-c107r2/bootstrap-original-install.py "$RUNNER_TEMP/pure-ftpd-transfer-history-inputs" "$RUNNER_TEMP/pure-ftpd-transfer-history-private" > "$RUNNER_TEMP/pure-ftpd-transfer-history-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/pure-ftpd-transfer-history-private/bootstrap-step.stderr"
      - name: Verify real FTPS transfers and historical queries
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pure-ftpd-transfer-history-c107r2/pure-ftpd-transfer-history.py "$RUNNER_TEMP/pure-ftpd-transfer-history-private" > "$RUNNER_TEMP/pure-ftpd-transfer-history-private/pure-ftpd-transfer-history-step.stdout" 2> "$RUNNER_TEMP/pure-ftpd-transfer-history-private/pure-ftpd-transfer-history-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-pure-ftpd-transfer-history-c107r2/finish.py "$RUNNER_TEMP/pure-ftpd-transfer-history-private" "$RUNNER_TEMP/pure-ftpd-transfer-history-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c107r2-native-pure-ftpd-transfer-history-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pure-ftpd-transfer-history-public/
          if-no-files-found: error
          retention-days: 14
