name: actual C38 AMD64 NFS131 declared OS matrix

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - scripts/native-nfs-c38/dispatch.json

permissions:
  contents: read

concurrency:
  group: native-nfs-c38-os-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    strategy:
      fail-fast: false
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download original reviewed signed cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-nfs-c38-assets"
          gh release view qa-runtimeextensionclosurecandidate38-20261031-qa1 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/cohort.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert not v["isDraft"] and v["isPrerelease"]' "$RUNNER_TEMP/cohort.json"
          gh release download qa-runtimeextensionclosurecandidate38-20261031-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-nfs-c38-assets"
          python3 - "$RUNNER_TEMP/native-nfs-c38-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '513b40a196953d7deb108bf0feb0cd038e4acbfb34cc74f4bced8d6eb59e9ea7'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == '2273aea05853e725c283f210abe70da0a53b808709d4c0245467abd896b53203'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Exact original signed cohort verified')
          PY
      - name: Prepare actual hardware guest tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Fresh original-key programme and NFS131 actual kernel journey
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-nfs-c38-public"
          sudo -n python3 -I -B scripts/native-nfs-c38/kvm.py "$RUNNER_TEMP/native-nfs-c38-assets" scripts/native-nfs-c38 "$RUNNER_TEMP/native-nfs-c38-public" "$OS_CASE"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-nfs-c38-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-nfs-c38-public/
          retention-days: 7
          if-no-files-found: warn
