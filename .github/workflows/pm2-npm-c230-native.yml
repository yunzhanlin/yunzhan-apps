name: PM2 actual public npm and rollback native C230
on:
  push:
    branches: [codex/pm2-npm-c230-current-native]
    paths: [scripts/native-pm2-c230/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  pm2-npm:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original signed programme and exact fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-pm2-c230/download.py "$RUNNER_TEMP/pm2-inputs" "$RUNNER_TEMP/pm2-private"
      - name: Normal original signed native first installation
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/bootstrap-original-install.py "$RUNNER_TEMP/pm2-inputs" "$RUNNER_TEMP/pm2-private" > "$RUNNER_TEMP/pm2-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/pm2-private/bootstrap-step.stderr"
      - name: Preserve and protect this disposable developer image share directory
        run: sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/prepare-pm2-host.py "$RUNNER_TEMP/pm2-private"
      - name: Actual PM2 public npm deployment, lifecycle and rollback preservation
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/pm2-business.py "$RUNNER_TEMP/pm2-private" > "$RUNNER_TEMP/pm2-private/pm2-step.stdout" 2> "$RUNNER_TEMP/pm2-private/pm2-step.stderr"
      - name: Retain read-only original PM2 installer diagnostics
        if: always()
        run: sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-pm2-c230/diagnostics.py "$RUNNER_TEMP/pm2-private"
      - name: Encrypt complete original evidence including failures
        if: always()
        run: sudo python3 -I -B scripts/native-pm2-c230/finish.py "$RUNNER_TEMP/pm2-private" "$RUNNER_TEMP/pm2-public" phase1
      - name: Upload encrypted originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c230-native-pm2-npm-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pm2-public/
          if-no-files-found: error
          retention-days: 14
