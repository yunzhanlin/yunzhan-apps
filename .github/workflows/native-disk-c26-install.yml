name: actual native AMD64 disk141 installation and original cancellation

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-disk-c26-install.yml
      - scripts/native-disk-c26/**

permissions:
  contents: read

concurrency:
  group: native-disk-c26-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download exact signed private-QA cohort without passing tokens to guest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-disk-c26-assets"
          gh release download qa-diskcandidate26-20261029 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-disk-c26-assets"
          python3 - "$RUNNER_TEMP/native-disk-c26-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets-v3.json').read_bytes()).hexdigest() == '2d0840912a3638dcf478c79fcafd4db532b8fecef9327605a28e73e25b989bab'
          manifest = json.loads((base / 'assets-v3.json').read_bytes())
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Exact original signatures, public trust root and source-bound QA helpers downloaded; no credentials in payload')
          PY
      - name: Exact source-absence gate rejects hidden authority or unhealthy existing sources
        run: python3 -I -B scripts/native-disk-c26/test_source_gate.py
      - name: Baseline waits for real initial cursors without changing the full comparison
        run: python3 -I -B scripts/native-disk-c26/test_initialized_baseline.py
      - name: Prepare hardware guest tools without removing existing host software
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual clean C24 to C26 signed programme upgrade and original disk141 scan and cancellation
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-disk-c26-public"
          sudo -n python3 -I -B scripts/native-disk-c26/kvm-v3.py "$RUNNER_TEMP/native-disk-c26-assets" scripts/native-disk-c26 "$RUNNER_TEMP/native-disk-c26-public"
      - name: Retain public proof and encrypted full QA evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-disk-c26-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-disk-c26-public/
          retention-days: 7
          if-no-files-found: warn
