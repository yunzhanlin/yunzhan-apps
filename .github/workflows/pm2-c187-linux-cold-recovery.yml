name: Signed PM2 live and stopped project preservation on hard power loss
on:
  push:
    branches: [codex/pm2-c187-linux-cold-recovery]
    paths: [scripts/scripts/native-pm2-c187/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c187-pm2-matrix-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/pm2-c187-linux-cold-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        system: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: scripts/scripts/native-pm2-c187
      - name: Download the exact signed panel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/scripts/native-pm2-c187
          root="$RUNNER_TEMP/pm2-c187-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-mysqlverifiedrestorecandidate184r2-20261115-qa1
          test "$(git rev-parse HEAD^)" = "$(jq -r .published_head "$fixture/dispatch.json")"
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --pattern 'rabbitmq-migration-signed-release.py' --dir "$root"
          mv "$root/rabbitmq-migration-signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware virtualization
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Run signed PM2 projects and verify ownership and boot state after hard power loss
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/pm2-c187-public"
          sudo -n python3 -I -B scripts/scripts/native-pm2-c187/kvm.py "$RUNNER_TEMP/pm2-c187-signed" scripts/scripts/native-pm2-c187 "$RUNNER_TEMP/pm2-c187-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c187-pm2-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/pm2-c187-public/
          retention-days: 14
          if-no-files-found: warn
