name: Enterprise integrity C491 native inode ownership and real inotify restoration
on:
  push:
    branches: [codex/enterprise-integrity-c491-native]
    paths: [.github/workflows/enterprise-integrity-c491-native.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/enterprise-integrity-c491-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        system: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-enterprise-c491
      - name: Download original exact current signed programme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-enterprise-c491
          root="$RUNNER_TEMP/enterprise-c491-native-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-apachebuildstatuscandidate477-20261122-qa1
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/cohort.json" "$root/cohort.json"
          cp "$fixture/integrity-business.py" "$root/integrity-business.py"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated native hardware
        run: |
          set -eu
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual current native enterprise and website inode protection and live restoration
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/enterprise-c491-native-public"
          sudo -n python3 -I -B scripts/native-enterprise-c491/kvm.py "$RUNNER_TEMP/enterprise-c491-native-signed" scripts/native-enterprise-c491 "$RUNNER_TEMP/enterprise-c491-native-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c491-enterprise-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/enterprise-c491-native-public/
          retention-days: 14
          if-no-files-found: error
