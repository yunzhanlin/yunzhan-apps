name: actual native C29r9 AMD64 WAF country account data and traffic

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-country-c29r9-install.yml
      - scripts/native-country-c29r9/**

permissions:
  contents: read

concurrency:
  group: native-country-c29r9-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the complete published original-key QA cohort without guest credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-country-c29r9-assets"
          ready=false
          for attempt in $(seq 1 90); do
            if gh release view qa-countrycandidate29r9-20261029 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/country-release-status.json" 2>/dev/null && python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["isDraft"] is False and v["isPrerelease"] is True else 1)' "$RUNNER_TEMP/country-release-status.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          gh release download qa-countrycandidate29r9-20261029 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-country-c29r9-assets"
          gh release download qa-filtercandidate28-20261029 --repo yunzhanlin/yunzhan-apps --pattern "panel-0.1.0-dev.proapps24filtercandidate28-linux-amd64.tar.gz" --pattern "panel-0.1.0-dev.proapps24filtercandidate28-linux-amd64.tar.gz.manifest" --pattern "panel-0.1.0-dev.proapps24filtercandidate28-linux-amd64.tar.gz.sig" --dir "$RUNNER_TEMP/native-country-c29r9-assets"
          python3 - "$RUNNER_TEMP/native-country-c29r9-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '713e04cdd3d210f46cbe53a81e3a96f8e1bceffee2987759b2bf5dda510ee6c2'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == '4db07d8595c09f63c37a68a34c976dbddd52d408a464383d8db74beca4844369'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Both original-key programme cohorts and exact country QA helpers verified; no credentials in guest payload')
          PY
      - name: Prepare hardware guest tools while preserving existing host services
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Native signed upgrade store installation first account data and actual Nginx decisions
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-country-c29r9-public"
          sudo -n python3 -I -B scripts/native-country-c29r9/kvm.py "$RUNNER_TEMP/native-country-c29r9-assets" scripts/native-country-c29r9 "$RUNNER_TEMP/native-country-c29r9-public"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-country-c29r9-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-country-c29r9-public/
          retention-days: 7
          if-no-files-found: warn
