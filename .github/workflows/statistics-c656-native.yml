name: Statistics C656 current native geodata archive and cold acceptance
on:
  push:
    branches: [codex/statistics-c656-native]
    paths: [.github/workflows/statistics-c656-native.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/statistics-c656-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-statistics-c656
      - name: Download immutable original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-statistics-c656
          root="$RUNNER_TEMP/analytics-c656-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-apachebuildstatuscandidate477-20261122-qa1
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare actual native KVM and fixed infrastructure
        run: |
          set -eu
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf lsof
          test -c /dev/kvm
      - name: Actual current signed statistics archives city data and independent cold
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/analytics-c656-public"
          sudo -n python3 -I -B scripts/native-statistics-c656/kvm.py "$RUNNER_TEMP/analytics-c656-signed" scripts/native-statistics-c656 "$RUNNER_TEMP/analytics-c656-public"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c656-statistics-native-ubuntu24-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/analytics-c656-public/
          retention-days: 14
          if-no-files-found: error
