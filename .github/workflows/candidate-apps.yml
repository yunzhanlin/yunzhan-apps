name: isolated candidate catalogue and native ABI

on:
  push:
    branches: [codex/app-candidate, codex/backup-retention-c54, codex/private-backup-roots-c55r2, codex/apache-native-cc-c56r3, codex/apache-native-cc-c56r7, codex/apache-native-cc-c56r8, codex/apache-native-cc-c56r9, codex/apache-cc-log-archive-c57, codex/apache-cc-root-gid-c57r5, codex/apache-cc-archive-ui-c58, codex/analytics-spa-ready-c59r3, codex/analytics-navigation-order-c59r4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-native-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, independently resolved
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: candidate/panel-integration-load-balance/go.mod
          cache-dependency-path: candidate/panel-integration-load-balance/go.sum
      - name: Actual stable and candidate catalogues, signatures and historical regressions
        run: npm test
      - name: Candidate build must not modify the stable signed directory
        run: git diff --exit-code -- registry/apps.json schema/app.schema.json dist signatures candidate/dist candidate/signatures
      - name: Independent Draft202012 schema for signed fifty and exact intrusion111 negatives
        run: |
          python3 -m venv "$RUNNER_TEMP/yunzhan-schema-c35"
          "$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'jsonschema==4.25.1' 'referencing==0.36.2' 'attrs==26.1.0' 'jsonschema-specifications==2025.9.1' 'rpds-py==0.27.1' 'typing-extensions==4.16.0'
          YUNZHAN_SCHEMA_PYTHON="$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" node tools/check-intrusion-ubuntu22-schema.mjs
      - name: Independent analytics232 exact two-handler schema and all fifty legacy manifests
        run: YUNZHAN_SCHEMA_PYTHON="$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" node tools/check-analytics-client-schema.mjs
      - name: Independent analytics240 exact three-handler schema, future negatives and retained fifty
        run: YUNZHAN_SCHEMA_PYTHON="$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" node tools/check-analytics-route-schema.mjs
      - name: Independent analytics241 exact four-handler schema and immutable240 compatibility
        run: YUNZHAN_SCHEMA_PYTHON="$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" node tools/check-analytics-navigation-schema.mjs
      - name: Independent Apache CC250 ordered dual-handler schema and exact historical fifty
        run: YUNZHAN_SCHEMA_PYTHON="$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" node tools/check-apache-cc-schema.mjs
      - name: Independent Apache251 ordered archive handlers and all historical fifty manifests
        run: YUNZHAN_SCHEMA_PYTHON="$RUNNER_TEMP/yunzhan-schema-c35/bin/python3" node tools/check-apache-cc-archive-schema.mjs
      - name: Bind every backup directory source witness before long native suites
        run: python3 -I -B -c "import runpy; runpy.run_path('tools/run-backup-directory-native.py')['source_files']()"
      - name: Complete Root filesystem fixtures using the actual compiled candidate channel
        working-directory: candidate/panel-integration-load-balance
        run: sudo env CGO_ENABLED=0 "$(command -v go)" test -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./...
      - name: Actual Apache CC source methods and six real native C cases with nonempty execution proof
        working-directory: candidate/panel-integration-load-balance
        run: |
          sudo env CGO_ENABLED=0 "$(command -v go)" test -json -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^TestApacheCC' > "$RUNNER_TEMP/apache-cc-native.jsonl"
          node ../../tools/check-apache-cc-native.mjs "$RUNNER_TEMP/apache-cc-native.jsonl" "$(uname -m)"
      - name: Actual Apache rewrite variable source regression with exact nonempty execution
        working-directory: candidate/panel-integration-load-balance
        run: |
          sudo "$(command -v go)" test -json -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^TestApacheRewriteReplacementClosedVariables$' > "$RUNNER_TEMP/apache-rewrite-source.jsonl"
          python3 - "$RUNNER_TEMP/apache-rewrite-source.jsonl" <<'PY'
          import json,pathlib,platform,sys
          path=pathlib.Path(sys.argv[1]);assert path.is_file()and not path.is_symlink()and 0<path.stat().st_size<1<<20
          assert platform.system()=='Linux'and platform.machine()in('x86_64','aarch64')
          rows=[json.loads(line)for line in path.read_text().splitlines()];root='TestApacheRewriteReplacementClosedVariables'
          wanted={root}|{root+'/'+value for value in ['/index.php?name=$1','/index.php?name=$1&$args','/index.php?$query_string','/index.php$is_args$args','/index.php$is_args','/index.php?path=$uri']}
          started=[r['Test']for r in rows if r.get('Action')=='run'and r.get('Test')];passed=[r['Test']for r in rows if r.get('Action')=='pass'and r.get('Test')]
          assert len(wanted)==len(started)==len(passed)==7 and set(started)==set(passed)==wanted
          assert all(r['Package']=='local/panel/internal/executor'for r in rows)and not any(r['Action']in('skip','fail')for r in rows)and sum(r['Action']=='pass'and not r.get('Test')for r in rows)==1
          print(json.dumps({'ok':True,'architecture':platform.machine(),'actual_PASS':7,'skips':0,'normal_PHP_or_WAF_install_acceptance':False}))
          PY
      - name: Actual Apache Format2 and Format3 upgrade queue family and binding guards with nonempty execution proof
        working-directory: candidate/panel-integration-load-balance
        run: |
          sudo "$(command -v go)" test -json -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^TestProgramUpgradeQueuesApacheCCFormats' > "$RUNNER_TEMP/apache-upgrade-queue-native.jsonl"
          python3 - "$RUNNER_TEMP/apache-upgrade-queue-native.jsonl" <<'PY'
          import json,pathlib,platform,sys
          path=pathlib.Path(sys.argv[1]);assert path.is_file() and not path.is_symlink() and 0<path.stat().st_size<=4<<20
          rows=[json.loads(line)for line in path.read_text().splitlines()]
          assert 0<len(rows)<=10000 and platform.system()=='Linux' and platform.machine() in ('x86_64','aarch64')
          matrix='TestProgramUpgradeQueuesApacheCCFormatsAreTerminalOnlyAndFamilySpecific'
          bindings='TestProgramUpgradeQueuesApacheCCFormatsKeepEveryBindingFence'
          expected={matrix,bindings}
          expected.update(matrix+'/'+family+'-'+str(version)+'-'+state for family in ('apache-body','waf-engine','analytics-html')for version in (0,1,2,3,4)for state in ('ready','failed','building','unknown'))
          expected.update(bindings+'/'+str(version)+'-'+kind for version in (2,3)for kind in ('wrong-id','wrong-architecture','wrong-prefix','bad-start','missing-finish','reversed-time','duplicate-key','unknown-key','public-record','linked-record','cancelled-but-building'))
          assert len(expected)==84
          assert all(row.get('Package')=='local/panel/internal/executor' and row.get('Action')not in ('skip','fail') and (not row.get('Test') or row['Test'] in expected)for row in rows)
          for action in ('run','pass'):
              tests=[row['Test']for row in rows if row.get('Action')==action and row.get('Test')]
              assert len(tests)==len(set(tests))==84 and set(tests)==expected,'Missing, duplicate or foreign Root execution cannot qualify'
          assert sum(row.get('Action')=='pass' and not row.get('Test')for row in rows)==1
          index=json.loads(pathlib.Path('source-sha256.json').read_text())
          assert index['release']['frozen_inputs_sha256']=='8e9a4a7c5b409be22ceb21d28965c3f9e20f49d1a5820bce3ca440f6abd3b4f3' and len(index['files'])==2385
          print(json.dumps({'ok':True,'architecture':platform.machine(),'actual_Root_methods':2,'PASS':84,'skips':0,'source_inputs_sha256':index['release']['frozen_inputs_sha256'],'normal_installed_acceptance':False}))
          PY
      - name: Actual Root upgrade leases and absent-statistics shared namespace fixtures
        run: |
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_geodata_upgrade_lease.py
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_statistics_stop_barrier.py
      - name: Actual thirteen private backup directory source fixtures with nonempty Root execution proof
        run: |
          sudo python3 -I -B tools/run-backup-directory-native.py > "$RUNNER_TEMP/backup-directory-native.json"
          node tools/check-backup-directory-native.mjs "$RUNNER_TEMP/backup-directory-native.json" "$(uname -m)"
      - name: Analytics managed address trust and private Root include race fixtures (not installed Nginx acceptance)
        working-directory: candidate/panel-integration-load-balance
        run: |
          sudo "$(command -v go)" test -race -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/core -run '^TestAnalytics(ManagedClient|LegacyProxyVisitors|ClientAddressReport|ClientProxyIdentity|MinuteAdmission|CarriedRequest|StaleOrReversedClock|ExactClientMinute|ConcurrentCarried)'
          sudo "$(command -v go)" test -json -race -count=1 -p 1 -tags=qa_analytics_identity -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^TestNativeAnalyticsProxyIdentity' > "$RUNNER_TEMP/analytics-identity-root-native.jsonl"
          python3 - "$RUNNER_TEMP/analytics-identity-root-native.jsonl" <<'PY'
          import json,pathlib,sys
          rows=[json.loads(line)for line in pathlib.Path(sys.argv[1]).read_text().splitlines()if line.strip()]
          tests=[row['Test']for row in rows if row.get('Action')=='pass'and row.get('Test')]
          roots={name for name in tests if '/'not in name}
          expected={'TestNativeAnalyticsProxyIdentityPrivateFileAndStableRevalidation','TestNativeAnalyticsProxyIdentityRejectsUntrustedKeyAndParents','TestNativeAnalyticsProxyIdentityPreservesChangedOrPartialOriginal','TestNativeAnalyticsProxyIdentityCapacityRefusesWithoutDeletion'}
          assert roots==expected and len(tests)==len(set(tests))==23,('Native Root identity tests must actually execute: expected4 roots and23 pass records',roots,len(tests))
          assert not any(row.get('Action')in('skip','fail')for row in rows),'Native Root identity tests may not skip or fail'
          assert sum(row.get('Action')=='pass'and not row.get('Test')for row in rows)==1,'Missing actual Go package pass'
          print('Actual native Root identity execution:4 roots,21 leaf scenarios,23 PASS records,zero skips/failures')
          PY
          sudo "$(command -v go)" test -race -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/appcatalog -run '^TestAnalyticsClientAddressManifestRequiresBothHandlersAndExactIdentity$'
      - name: Actual route collector and manifest source cases with exact nonempty execution proof
        working-directory: candidate/panel-integration-load-balance
        run: |
          go test -json -race -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/core ./internal/appcatalog -run '^TestAnalytics(Route(TimingBoundsAndSeparation|ReportDeduplicatesWithoutChangingJourneyOrDocument|ReportGroupAndVisitLimitsAreVisible|ManifestRequiresAllHandlersAndExactApp)|Navigation(SequenceBoundsAndPassiveSeparation|OrderingConflictLegacyAndScope|SameSecondRealSQLReportAndFunnel|LegacyAndDelayedFunnelDisclosesUncertainty|ManifestRequiresFourExactScopedHandlers))$' > "$RUNNER_TEMP/analytics-route-source.jsonl"
          node ../../tools/check-analytics-route-execution.mjs "$RUNNER_TEMP/analytics-route-source.jsonl" "$(uname -m)"
      - name: Actual native backup retention reservation, starvation and read-only API regressions
        working-directory: candidate/panel-integration-load-balance
        run: |
          sudo "$(command -v go)" test -json -race -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/core -run '^Test(Retention|ScheduleRetention|SiteScheduleRetention|MariaDBRetention)' > "$RUNNER_TEMP/backup-retention-native.jsonl"
          node ../../tools/check-retention-native-execution.mjs "$RUNNER_TEMP/backup-retention-native.jsonl"
      - name: Native alert and PM2 race regression with the original candidate source
        working-directory: candidate/panel-integration-load-balance
        # Race instrumentation changes runtime cost. Keep the production 2s
        # full-capacity deadline and the PM2 5s independent-journal deadline in
        # the normal Root suite and dedicated steps; retain functional races here.
        run: sudo "$(command -v go)" test -race -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^Test(ModuleAlert|LoadBalance(Alert|Traffic)|ModuleHistory|ModuleInstalledRecord|ModuleUntrustedInstalledRecord|PM2)' -skip '^Test(LoadBalanceTrafficNativeMaximumRecordAndByteBudgetsMeasuredWithoutCommands|PM2ConfigurationUpgradeBudgetIsIndependentFromUnchangedLegacyBudget)$'
      - name: Original maximum alert inventory and production deadline without race instrumentation
        working-directory: candidate/panel-integration-load-balance
        run: sudo "$(command -v go)" test -v -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^TestLoadBalanceTrafficNativeMaximumRecordAndByteBudgetsMeasuredWithoutCommands$'
      - name: Original PM2 retained-journal capacity and five-second deadline without race instrumentation
        working-directory: candidate/panel-integration-load-balance
        run: sudo "$(command -v go)" test -v -count=1 -p 1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/executor -run '^TestPM2ConfigurationUpgradeBudgetIsIndependentFromUnchangedLegacyBudget$'
      - name: Actual PM2 uncertain-save, durable-cancellation and existing account receipt regressions
        working-directory: candidate/panel-integration-load-balance
        run: |
          npm ci --ignore-scripts --prefix web
          node --experimental-strip-types --test scripts/test-pm2-configuration-receipt.mjs scripts/test-user-management-receipt.mjs scripts/test-platform-management-receipt.mjs
          node --experimental-strip-types --test scripts/test-analytics-session.mjs
          node --experimental-strip-types --test scripts/test-analytics-performance.mjs
          node --experimental-strip-types --test scripts/test-apache-cc-archives.mjs
      - name: Native regression must preserve the exact exported source cohort
        run: git diff --exit-code -- candidate/panel-integration-load-balance
      - name: Native signed fifty manifest ABI, not installation or all-fifty commercial acceptance
        working-directory: candidate/panel-integration-load-balance
        run: go test -count=1 -ldflags='-X=local/panel/internal/appcatalog.officialCatalogChannel=candidate' ./internal/appcatalog -run '^TestPublishedCandidateRepositoryCurrentSignedManifestABI$' -published-candidate-app-registry-root="$GITHUB_WORKSPACE/candidate"
      - name: Retain original synthetic Root test events for independent execution verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: analytics-root-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/analytics-identity-root-native.jsonl
          retention-days: 7
          if-no-files-found: error
      - name: Retain original backup retention source test events for independent count verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backup-retention-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-retention-native.jsonl
          retention-days: 7
          if-no-files-found: error
      - name: Retain actual Root private backup directory execution for independent count verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backup-directory-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-directory-native.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain original Apache CC source execution for independent nonempty verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apache-cc-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-cc-native.jsonl
          retention-days: 7
          if-no-files-found: error
      - name: Retain original Apache Format2 and Format3 upgrade queue source execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apache-upgrade-queue-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-upgrade-queue-native.jsonl
          retention-days: 7
          if-no-files-found: error
      - name: Retain original nonempty Apache rewrite variable execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apache-rewrite-native-source-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-rewrite-source.jsonl
          retention-days: 7
          if-no-files-found: error
      - name: Retain original route source cases for independent nonempty count verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: analytics-route-source-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/analytics-route-source.jsonl
          retention-days: 7
          if-no-files-found: error
