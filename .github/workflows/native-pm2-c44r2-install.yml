name: actual C44r2 AMD64 upgrade accounts and signed PM2 update

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - scripts/native-pm2-c44r2/dispatch.json

permissions:
  contents: read

concurrency:
  group: native-pm2-c44r2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the original reviewed signed cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-pm2-c44r2-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/430348503 > "$RUNNER_TEMP/cohort.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["id"]==430348503 and not v["draft"] and v["prerelease"] and v["tag_name"]=="qa-alertreadonlycandidate44r2-20261101-qa1" and len(v["assets"])==7' "$RUNNER_TEMP/cohort.json"
          gh release download qa-alertreadonlycandidate44r2-20261101-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-pm2-c44r2-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/429937013 > "$RUNNER_TEMP/bootstrap-cohort.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["id"]==429937013 and not v["draft"] and v["prerelease"] and v["tag_name"]=="qa-phpswitchpreservecandidate41r3-20261031-qa1" and len(v["assets"])==7' "$RUNNER_TEMP/bootstrap-cohort.json"
          gh release download qa-phpswitchpreservecandidate41r3-20261031-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --dir "$RUNNER_TEMP/native-pm2-c44r2-assets"
          cp scripts/native-pm2-c44r2/guest.py scripts/native-pm2-c44r2/prepare.py scripts/native-pm2-c44r2/functional.py scripts/native-pm2-c44r2/capture.py scripts/native-pm2-c44r2/bootstrap.py scripts/native-pm2-c44r2/shop.py "$RUNNER_TEMP/native-pm2-c44r2-assets/"
          cp candidate/panel-integration-load-balance/packaging/signed-release.py "$RUNNER_TEMP/native-pm2-c44r2-assets/"
          cp scripts/native-pm2-c44r2/payload.json "$RUNNER_TEMP/native-pm2-c44r2-assets/assets.json"
          python3 - "$RUNNER_TEMP/native-pm2-c44r2-assets" <<'PY'
          import ast,hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base/'assets.json').read_bytes()).hexdigest()=='ac6918bc32e4a903214b480e36e801708dfbb79ec2fd5ff9ab4f55a58f500321'
          manifest=json.loads((base/'assets.json').read_bytes())
          assert manifest['source_inputs_sha256']=='038aeb46562e6e080e8bba061c1dd3285405056b9e8fafe6bcaba6213abe57cd'
          for name,digest in manifest['files'].items():
              assert pathlib.PurePath(name).name==name
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest
          signer_pin_expression=ast.dump(ast.parse("sha(payload / 'signed-release.py')",mode='eval').body)
          signer_pins=[]
          for node in ast.walk(ast.parse((base/'guest.py').read_bytes())):
              if isinstance(node,ast.Assert) and isinstance(node.test,ast.Compare) and ast.dump(node.test.left)==signer_pin_expression:
                  assert len(node.test.ops)==len(node.test.comparators)==1 and isinstance(node.test.ops[0],ast.Eq) and isinstance(node.test.comparators[0],ast.Constant)
                  signer_pins.append(node.test.comparators[0].value)
          assert signer_pins==[manifest['files']['signed-release.py']]
          print('Original programme signatures, key and reviewed QA payload bound')
          PY
      - name: Prepare actual hardware guest tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Normal C41 to C44r2 programme upgrade, actual nonroot journey and compat6 signed store update
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-pm2-c44r2-public"
          sudo -n python3 -I -B scripts/native-pm2-c44r2/kvm.py "$RUNNER_TEMP/native-pm2-c44r2-assets" scripts/native-pm2-c44r2 "$RUNNER_TEMP/native-pm2-c44r2-public" "$OS_CASE"
      - name: Retain public proof and encrypted original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-pm2-c44r2-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-pm2-c44r2-public/
          retention-days: 7
          if-no-files-found: warn
