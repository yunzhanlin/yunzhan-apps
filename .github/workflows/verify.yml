name: verify application registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Development migration guard fixtures (not a live service-upgrade proof)
        run: python3 -m unittest discover -s panel-integration/packaging -p 'test_development_upgrade_safety.py'
      - name: Ordinary upgrade gateway policy fixtures (not native traffic acceptance)
        run: python3 -m unittest discover -s panel-integration/packaging -p 'test_install_gateway_policy.py'
      - name: Production upgrade trusted-root filesystem and SQLite fixtures (service runner is not native systemd acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_production_upgrade.py'
      - name: Rollback-referenced cleanup fixtures and own bind mount (never prunes an installation)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_prune_releases.py'
      - name: Read-only WAF rotation and inventory UI regression
        run: node --experimental-strip-types --test panel-integration/scripts/test-waf-rotation-refresh.mjs panel-integration/scripts/test-waf-body-inventory.mjs
      - name: Locked frontend dependencies for actual notification editor regression
        run: npm ci --prefix panel-integration/web --ignore-scripts
      - name: Load-balance alert scope and actual save handler (not installed business proof)
        run: node --test panel-integration/scripts/test-load-balance-alerts.mjs
      - name: Closed readable delivery summaries and actual history handlers
        run: node --experimental-strip-types --test panel-integration/scripts/test-outbound-source-view.mjs
      - run: git diff --exit-code -- dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel-integration/go.mod
          cache-dependency-path: panel-integration/go.sum
      - name: Native Linux implementation regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test ./...
      - name: Bounded history reader race regression (not capacity timing acceptance)
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestLoadBalanceHistoryParallelReadersRemainBoundedAndFailClosed$' -count=1
      - name: Candidate maintenance gate and cancellation race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/upgradeguard -count=1
