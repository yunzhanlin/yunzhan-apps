name: verify application registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Read-only WAF rotation UI refresh regression
        run: node --experimental-strip-types --test panel-integration/scripts/test-waf-rotation-refresh.mjs
      - run: git diff --exit-code -- dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel-integration/go.mod
          cache-dependency-path: panel-integration/go.sum
      - name: Native Linux implementation regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test ./...
