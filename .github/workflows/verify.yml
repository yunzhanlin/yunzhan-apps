name: verify application registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Root development transaction and startup binding fixtures (service runner is not native systemd acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_development_upgrade_safety.py'
      - name: Immutable external startup interlock filesystem fixtures (not native boot acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_start_guard_install.py'
      - name: Ordinary upgrade gateway policy fixtures (not native traffic acceptance)
        run: python3 -m unittest discover -s panel-integration/packaging -p 'test_install_gateway_policy.py'
      - name: Production upgrade trusted-root filesystem and SQLite fixtures (service runner is not native systemd acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_production_upgrade.py'
      - name: Rollback-referenced cleanup fixtures and own bind mount (never prunes an installation)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_prune_releases.py'
      - name: Read-only WAF rotation and inventory UI regression
        run: node --experimental-strip-types --test panel-integration/scripts/test-waf-rotation-refresh.mjs panel-integration/scripts/test-waf-body-inventory.mjs
      - name: Locked frontend dependencies for actual notification editor regression
        run: npm ci --prefix panel-integration/web --ignore-scripts
      - name: Load-balance alert scope and actual save handler (not installed business proof)
        run: node --test panel-integration/scripts/test-load-balance-alerts.mjs
      - name: Closed readable delivery summaries and actual history handlers
        run: node --experimental-strip-types --test panel-integration/scripts/test-outbound-source-view.mjs
      - run: git diff --exit-code -- dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel-integration/go.mod
          cache-dependency-path: panel-integration/go.sum
      - name: Native Linux implementation regression
        working-directory: panel-integration
        # Do not run the 384 MiB/2s source-read capacity test concurrently
        # with other packages' CPU/I/O-heavy fixtures on a shared runner.
        # Keep every test, original capacity and original deadline intact.
        run: sudo "$(command -v go)" test -p 1 ./...
      - name: Unchanged maximum source-read capacity repeated in an isolated package process
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -p 1 ./internal/executor -run '^TestLoadBalanceTrafficNativeMaximumRecordAndByteBudgetsMeasuredWithoutCommands$' -count=3
      - name: Bounded history reader race regression (not capacity timing acceptance)
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestLoadBalanceHistoryParallelReadersRemainBoundedAndFailClosed$' -count=1
      - name: Candidate maintenance gate, actual root FLOCK and nobody startup race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/upgradeguard -count=1
      - name: Read-only native upgrade inventory identity and typed JSON race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestProgramUpgradeQueues' -count=1
      - name: Statistics expired-cursor ownership and one-transaction retirement race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestStatisticsHistory(ExpiredConsumedMissingCursorsReleaseCapacityWithoutChangingLogs|RetirementPreservesLiveUnreadConflictingOtherSiteAndFutureBoundary|RetirementAndRowsAreOneTransaction)$' -count=1
      - name: Checksum-bound panel handler requirements and strict legacy refusal race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/appcatalog -run '^Test(PanelRequirements|LegacyStrictDecoderRefusesRequiredHandlerField|NewStatisticsVersionsCannotOmitMandatoryHandlerRequirement|StatisticsIdentityVersionRequiresBothBoundHandlersAndRejectsOldAvailability)' -count=1
      - name: Statistics2.5 exact schema and closed lifecycle race regression (not installed native Nginx acceptance)
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestStatistics(SchemaExact|IdentityLifecycle|RequestReceipt|RequestIdentity|RequestProgramUpgrade|RequestSelectedInstall|Gzip|ArchiveRuntime|LogTransaction)' -count=1
      - name: Statistics history UI and bounded report regression
        run: node --test panel-integration/scripts/test-statistics-history.mjs
      - name: Geography candidate authority and complete database reader race regression (not app installation acceptance)
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/geodata ./internal/appcatalog -count=1
      - name: Geography candidate root storage, epoch, bounded cache and verifier contract regression (not native systemd acceptance)
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^Test(StatisticsGeo|ProgramUpgradeQueuesGeo)' -count=1
      - name: Geography authenticated API, permissions and worker regression
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/core -run '^TestStatisticsGeo' -count=1
      - name: WAF legacy settings cannot acknowledge and discard advanced intent
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/core -run '^Test(WAFLegacySettingsNeverSilentlyDiscardAdvancedPolicyFields|SoftwareActionQueueValidationAndIdempotency|SoftwareSettingsAreClosedSchemas|WAFTrustedProxy)' -count=1
