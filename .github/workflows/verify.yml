name: verify application registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Root development transaction and startup binding fixtures (service runner is not native systemd acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_development_upgrade_safety.py'
      - name: Immutable external startup interlock filesystem fixtures (not native boot acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_start_guard_install.py'
      - name: Ordinary upgrade gateway policy fixtures (not native traffic acceptance)
        run: python3 -m unittest discover -s panel-integration/packaging -p 'test_install_gateway_policy.py'
      - name: Production upgrade trusted-root filesystem and SQLite fixtures (service runner is not native systemd acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_production_upgrade.py'
      - name: Rollback-referenced cleanup fixtures and own bind mount (never prunes an installation)
        run: sudo python3 -B -m unittest discover -s panel-integration/packaging -p 'test_prune_releases.py'
      - name: Read-only WAF rotation and inventory UI regression
        run: node --experimental-strip-types --test panel-integration/scripts/test-waf-rotation-refresh.mjs panel-integration/scripts/test-waf-body-inventory.mjs
      - name: Locked frontend dependencies for actual notification editor regression
        run: npm ci --prefix panel-integration/web --ignore-scripts
      - name: Load-balance alert scope and actual save handler (not installed business proof)
        run: node --test panel-integration/scripts/test-load-balance-alerts.mjs
      - name: Closed readable delivery summaries and actual history handlers
        run: node --experimental-strip-types --test panel-integration/scripts/test-outbound-source-view.mjs
      - run: git diff --exit-code -- dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel-integration/go.mod
          cache-dependency-path: panel-integration/go.sum
      - name: Native Linux implementation regression
        working-directory: panel-integration
        # Do not run the 384 MiB/2s source-read capacity test concurrently
        # with other packages' CPU/I/O-heavy fixtures on a shared runner.
        # Keep every test, original capacity and original deadline intact.
        run: sudo "$(command -v go)" test -p 1 ./...
      - name: Unchanged maximum source-read capacity repeated in an isolated package process
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -p 1 ./internal/executor -run '^TestLoadBalanceTrafficNativeMaximumRecordAndByteBudgetsMeasuredWithoutCommands$' -count=3
      - name: Bounded history reader race regression (not capacity timing acceptance)
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestLoadBalanceHistoryParallelReadersRemainBoundedAndFailClosed$' -count=1
      - name: Candidate maintenance gate, actual root FLOCK and nobody startup race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/upgradeguard -count=1
      - name: Read-only native upgrade inventory identity and typed JSON race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestProgramUpgradeQueues' -count=1
      - name: Separate maintenance authority, HTTPS peer identity and original receipt race regression (not installed remote command acceptance)
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/core -run '^TestPlatformMaintenance' -count=1
      - name: Every module workspace emits array collections including read-only maintenance
        working-directory: panel-integration-geography
        run: go test -race ./internal/core -run '^TestModuleWorkspace' -count=1
      - name: Exact disk version and real status-builder update policy (fixtures, not installed upgrade acceptance)
        working-directory: panel-integration-geography
        run: go test -race ./internal/core -run '^TestDiskUsage' -count=1 -v
      - name: Install locked management regression dependencies without lifecycle scripts
        run: npm ci --prefix panel-integration-geography/web --ignore-scripts
      - name: Compiled management opener handles legacy null collections without inventing operations
        run: node --test panel-integration-geography/scripts/test-deferred-workspace.mjs
      - name: Issued maintenance secret lifetime and complete read-only inventory regression (not installed or elapsed-time proof)
        run: node --test panel-integration-geography/scripts/test-platform-maintenance-secrets.mjs
      - name: Disk inode usage selectors, actual compiled handlers and bounded UI source (not installed application acceptance)
        run: node --test panel-integration-geography/scripts/test-disk-usage.mjs
      - name: Actual compiled disk cancellation and remote identity-before-submit fixtures (not installed UI or native cancellation proof)
        run: node --test panel-integration-geography/scripts/test-disk-scan-lifecycle.mjs panel-integration-geography/scripts/test-remote-sync.mjs
      - name: Ordinary-user Linux disk usage and actual 100003-entry temporary filesystem fixture (not installed app or OS matrix acceptance)
        working-directory: panel-integration-geography
        run: go test -race ./internal/executor -run '^Test(DiskUsage|ModuleDisk)' -count=1 -v
      - name: Root maintenance original journal and no-replay crash fixtures (not real Nginx business or power-loss acceptance)
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestPlatformMaintenance(Root|Native)' -count=1
      - name: Latest maintenance upgrade SQL and transaction fixtures (not installed command acceptance)
        run: sudo python3 -B -m unittest discover -s panel-integration-geography/packaging -p 'test_production_upgrade.py'
      - name: Previous-release integrity policy and fixed native prerequisites (Root filesystem fixtures only)
        run: |
          sudo python3 -B -m unittest discover -s panel-integration-geography/packaging -p 'test_verify_previous_release.py'
          sudo python3 -B -m unittest discover -s panel-integration-geography/packaging -p 'test_native_build_directories.py'
          sudo python3 -B -m unittest discover -s panel-integration-geography/packaging -p 'test_waf_state_directory.py'
      - name: Statistics expired-cursor ownership and one-transaction retirement race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestStatisticsHistory(ExpiredConsumedMissingCursorsReleaseCapacityWithoutChangingLogs|RetirementPreservesLiveUnreadConflictingOtherSiteAndFutureBoundary|RetirementAndRowsAreOneTransaction)$' -count=1
      - name: Checksum-bound panel handler requirements and strict legacy refusal race regression
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/appcatalog -run '^Test(PanelRequirements|LegacyStrictDecoderRefusesRequiredHandlerField|NewStatisticsVersionsCannotOmitMandatoryHandlerRequirement|StatisticsIdentityVersionRequiresBothBoundHandlersAndRejectsOldAvailability)' -count=1
      - name: Statistics2.5 exact schema and closed lifecycle race regression (not installed native Nginx acceptance)
        working-directory: panel-integration
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestStatistics(SchemaExact|IdentityLifecycle|RequestReceipt|RequestIdentity|RequestProgramUpgrade|RequestSelectedInstall|Gzip|ArchiveRuntime|LogTransaction)' -count=1
      - name: Statistics history UI and bounded report regression
        run: node --test panel-integration/scripts/test-statistics-history.mjs
      - name: Geography candidate authority and complete database reader race regression (not app installation acceptance)
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/geodata ./internal/appcatalog -count=1
      - name: Same-commit repository partial-read recovery and unchanged authority boundaries
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/appcatalog -run '^TestRepository' -count=1
      - name: Geography candidate root storage, epoch, bounded cache and verifier contract regression (not native systemd acceptance)
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^Test(StatisticsGeo|ProgramUpgradeQueuesGeo)' -count=1
      - name: Geography authenticated API, permissions and worker regression
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/core -run '^TestStatisticsGeo' -count=1
      - name: WAF legacy settings cannot acknowledge and discard advanced intent
        working-directory: panel-integration-geography
        run: sudo "$(command -v go)" test -race ./internal/core -run '^Test(WAFLegacySettingsNeverSilentlyDiscardAdvancedPolicyFields|SoftwareActionQueueValidationAndIdempotency|SoftwareSettingsAreClosedSchemas|WAFTrustedProxy)' -count=1
      - name: Candidate host disk Core, native primitive and manifest contracts (not installed full-host job proof)
        working-directory: panel-integration-disk
        run: sudo "$(command -v go)" test -p 1 ./internal/core ./internal/diskjob ./internal/diskusage ./internal/appcatalog -count=1
      - name: Candidate host job authority and typed receipts race regression
        working-directory: panel-integration-disk
        run: sudo "$(command -v go)" test -race ./internal/core ./internal/diskjob -run '^Test(HostDisk|.*Closure|.*Original|.*Receipt)' -count=1
      - name: Candidate fixed original program admission and native upgrade barriers (not actual installed dispatch)
        working-directory: panel-integration-disk
        run: sudo "$(command -v go)" test ./internal/executor -run '^TestHostProducer|^TestProgramUpgradeQueues' -count=1 -v
      - name: Candidate production and development drain contracts (trusted-root fixtures only)
        run: sudo python3 -B -m unittest discover -s panel-integration-disk/packaging -p 'test_*upgrade*.py'
      - name: Locked candidate disk UI dependencies without lifecycle scripts
        run: npm ci --prefix panel-integration-disk/web --ignore-scripts
      - name: Candidate host disk selectors and actual component build (not installed UI)
        run: |
          node --experimental-strip-types --test panel-integration-disk/scripts/test-host-disk.mjs
          npm run build --prefix panel-integration-disk/web
      - name: Candidate host disk real Vue browser fault flows (synthetic API, not installed app acceptance)
        run: |
          node panel-integration-disk/web/node_modules/playwright/cli.js install --with-deps chromium
          disk_ui_out="$(mktemp -d)"
          node panel-integration-disk/scripts/qa-host-disk-workspace.mjs "$disk_ui_out"
      - name: Fixed runtime journal-to-index and strict root identity regression (not installed worker acceptance)
        working-directory: panel-integration-disk-fix
        run: sudo "$(command -v go)" test -p 1 ./internal/diskjob ./internal/diskusage ./internal/appcatalog -count=1 -v
      - name: Fixed original spool handoff and replaced inode/base refusal race regression
        working-directory: panel-integration-disk-fix
        run: sudo "$(command -v go)" test -race ./internal/diskjob -run '^TestHostJournalNativeSpool' -count=1 -v
      - name: Fixed runtime preserves original Core authority and existing native admission/upgrade barriers
        working-directory: panel-integration-disk-fix
        run: |
          sudo "$(command -v go)" test -p 1 ./internal/core -count=1
          sudo "$(command -v go)" test ./internal/executor -run '^TestHostProducer|^TestProgramUpgradeQueues' -count=1 -v
      - name: Locked fixed runtime UI without lifecycle scripts
        run: npm ci --prefix panel-integration-disk-fix/web --ignore-scripts
      - name: Fixed Docker nsfs display inventory and complete real component build
        run: |
          node --experimental-strip-types --test panel-integration-disk-fix/scripts/test-host-disk.mjs
          npm run build --prefix panel-integration-disk-fix/web
          node panel-integration-disk-fix/scripts/web-entry-budget.mjs panel-integration-disk-fix/web/dist
      - name: Fixed actual Vue nsfs display-only and prior fault flow regression (synthetic API, not installed proof)
        run: |
          node panel-integration-disk-fix/web/node_modules/playwright/cli.js install --with-deps chromium
          disk_fix_ui_out="$(mktemp -d)"
          node panel-integration-disk-fix/scripts/qa-host-disk-workspace.mjs "$disk_fix_ui_out"
      - name: Diagnostic candidate complete Root Linux contracts, not installed failure-fix acceptance
        working-directory: panel-integration-disk-diagnostic
        run: sudo "$(command -v go)" test -p 1 ./... -count=1
      - name: Diagnostic fixed enum filtering, bounded stderr and unchanged native exit race regression
        working-directory: panel-integration-disk-diagnostic
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestDiskHostDiagnostic' -count=1 -v
      - name: Locked diagnostic candidate UI without lifecycle scripts
        run: npm ci --prefix panel-integration-disk-diagnostic/web --ignore-scripts
      - name: Diagnostic candidate complete UI and unchanged entry budget, not actual installed workflow
        run: |
          node --experimental-strip-types --test panel-integration-disk-diagnostic/scripts/test-host-disk.mjs
          npm run build --prefix panel-integration-disk-diagnostic/web
          node panel-integration-disk-diagnostic/scripts/web-entry-budget.mjs panel-integration-disk-diagnostic/web/dist
      - name: Reason candidate complete Root Linux contracts, not installed reason-fix acceptance
        working-directory: panel-integration-disk-reason
        run: sudo "$(command -v go)" test -p 1 ./... -count=1
      - name: Reason finalization and inherited bounded diagnostic race regression
        working-directory: panel-integration-disk-reason
        run: sudo "$(command -v go)" test -race ./internal/executor -run '^TestDiskHost(Diagnostic|FailureReport)' -count=1 -v
      - name: Locked reason candidate UI without lifecycle scripts
        run: npm ci --prefix panel-integration-disk-reason/web --ignore-scripts
      - name: Legacy receipt compatibility, presentation and exact export data regression
        run: |
          node --experimental-strip-types --test panel-integration-disk-reason/scripts/test-host-disk.mjs
          npm run build --prefix panel-integration-disk-reason/web
          node panel-integration-disk-reason/scripts/web-entry-budget.mjs panel-integration-disk-reason/web/dist
      - name: Actual Vue deduplicates only legacy warning presentation (closed synthetic API, not installed acceptance)
        run: |
          node panel-integration-disk-reason/web/node_modules/playwright/cli.js install --with-deps chromium
          disk_reason_ui_out="$(mktemp -d)"
          node panel-integration-disk-reason/scripts/qa-host-disk-workspace.mjs "$disk_reason_ui_out"
      - name: Fleet candidate complete Root Linux contracts (source fixtures, not installed fleet acceptance)
        working-directory: panel-integration-platform-fleet
        run: |
          sudo "$(command -v go)" test -p 1 ./... -count=1
          go vet ./...
      - name: Fleet bounded overlap cancellation protocol identity and existing authority races
        working-directory: panel-integration-platform-fleet
        run: sudo "$(command -v go)" test -race ./internal/core -run '^Test(Platform|AppPlatform)' -count=1 -v
      - name: Locked fleet candidate UI dependencies without lifecycle scripts
        run: npm ci --prefix panel-integration-platform-fleet/web --ignore-scripts
      - name: Complete fleet candidate management build and unchanged entry budget (not installed UI)
        run: |
          VITE_PANEL_VERSION=0.1.0-dev.proapps24fleetbftj npm run build --prefix panel-integration-platform-fleet/web
          node panel-integration-platform-fleet/scripts/web-entry-budget.mjs panel-integration-platform-fleet/web/dist
      - name: Fleet report and pinned Memcached candidate complete Root Linux contracts (source only)
        working-directory: panel-integration-platform-health-view
        run: |
          sudo "$(command -v go)" test -p 1 ./... -count=1
          go vet ./...
      - name: Locked fleet report UI dependencies without lifecycle scripts
        run: npm ci --prefix panel-integration-platform-health-view/web --ignore-scripts
      - name: Fleet report availability, original identity and explicit read cancellation (synthetic transport only)
        run: |
          node --experimental-strip-types --test panel-integration-platform-health-view/scripts/test-platform-health-view.mjs panel-integration-platform-health-view/scripts/test-platform-health-lifecycle.mjs panel-integration-platform-health-view/scripts/test-platform-management-receipt.mjs panel-integration-platform-health-view/scripts/test-disk-scan-lifecycle.mjs
          VITE_PANEL_VERSION=0.1.0-dev.proapps24fleetviewbfva npm run build --prefix panel-integration-platform-health-view/web
          node panel-integration-platform-health-view/scripts/web-entry-budget.mjs panel-integration-platform-health-view/web/dist
      - name: Actual Vue fleet cards and close/unmount cancellation at 1440 390 320 (synthetic API, not installed acceptance)
        run: |
          node panel-integration-platform-health-view/web/node_modules/playwright/cli.js install --with-deps chromium
          node panel-integration-platform-health-view/scripts/test-platform-health-ui.mjs
