name: Signed Apache website diagnosis on native Linux
on:
  push:
    branches: [codex/site-apache-diagnosis-c104-native-qa2]
    paths: [scripts/native-site-apache-diagnosis-c104/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  site-apache-diagnosis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-site-apache-diagnosis-c104/download.py "$RUNNER_TEMP/site-apache-diagnosis-inputs" "$RUNNER_TEMP/site-apache-diagnosis-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-site-apache-diagnosis-c104/bootstrap-original-install.py "$RUNNER_TEMP/site-apache-diagnosis-inputs" "$RUNNER_TEMP/site-apache-diagnosis-private" > "$RUNNER_TEMP/site-apache-diagnosis-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/site-apache-diagnosis-private/bootstrap-step.stderr"
      - name: Verify the Apache site configuration and listener after signed store update
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-site-apache-diagnosis-c104/site-apache-diagnosis.py "$RUNNER_TEMP/site-apache-diagnosis-private" > "$RUNNER_TEMP/site-apache-diagnosis-private/site-apache-diagnosis-step.stdout" 2> "$RUNNER_TEMP/site-apache-diagnosis-private/site-apache-diagnosis-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-site-apache-diagnosis-c104/finish.py "$RUNNER_TEMP/site-apache-diagnosis-private" "$RUNNER_TEMP/site-apache-diagnosis-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c104-native-site-apache-diagnosis-qa2-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/site-apache-diagnosis-public/
          if-no-files-found: error
          retention-days: 14
