name: actual native C30r2 AMD64 country capacity and preserving upgrade

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-country-c30r2-install.yml
      - scripts/native-country-c30r2/**

permissions:
  contents: read

concurrency:
  group: native-country-c30r2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the complete published original-key QA cohort without guest credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-country-c30r2-assets"
          ready=false
          for attempt in $(seq 1 90); do
            if gh release view qa-countrycapacitycandidate30r2-20261029 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/country-release-status.json" 2>/dev/null && python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["isDraft"] is False and v["isPrerelease"] is True else 1)' "$RUNNER_TEMP/country-release-status.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          gh release download qa-countrycapacitycandidate30r2-20261029 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-country-c30r2-assets"
          gh release download qa-countrycandidate29r11-20261029 --repo yunzhanlin/yunzhan-apps --pattern "panel-0.1.0-dev.proapps24countrycandidate29r11-linux-amd64.tar.gz" --pattern "panel-0.1.0-dev.proapps24countrycandidate29r11-linux-amd64.tar.gz.manifest" --pattern "panel-0.1.0-dev.proapps24countrycandidate29r11-linux-amd64.tar.gz.sig" --dir "$RUNNER_TEMP/native-country-c30r2-assets"
          python3 - "$RUNNER_TEMP/native-country-c30r2-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == 'e97c26b192016b11bfffc583705a7704399db03e511868432e431d0e5f864f54'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == 'c072149139c07878015d2cbbe8d9cdfa6fbcca2ae00e28a1b19d391944b62499'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Both original-key programme cohorts and exact country QA helpers verified; no credentials in guest payload')
          PY
      - name: Prepare hardware guest tools while preserving existing host services
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Original signed R11 account/data followed by C30r2 preserving upgrade and new country policy decisions
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-country-c30r2-public"
          sudo -n python3 -I -B scripts/native-country-c30r2/kvm.py "$RUNNER_TEMP/native-country-c30r2-assets" scripts/native-country-c30r2 "$RUNNER_TEMP/native-country-c30r2-public"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-country-c30r2-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-country-c30r2-public/
          retention-days: 7
          if-no-files-found: warn
