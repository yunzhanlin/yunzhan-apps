name: Integrity C301 original legacy 1.4.1 data and ordinary signed store 1.5.0 upgrade
on:
  push:
    branches: [codex/integrity-c301-native-legacy-upgrade]
    paths: [scripts/native-integrity-c301-legacy-upgrade/dispatch.json]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/integrity-c301-native-legacy-upgrade'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        system: [debian13, ubuntu22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-integrity-c301-legacy-upgrade
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download original exact current signed programme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-integrity-c301-legacy-upgrade
          root="$RUNNER_TEMP/legacy-upgrade-c301-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-integritydurableflagscandidate299-20261121-qa1
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          legacy_tag=$(jq -r .legacy_tag "$fixture/dispatch.json")
          test "$legacy_tag" = qa-analyticsnavigationcandidate59r4-20261105-qa1
          gh release download "$legacy_tag" --repo yunzhanlin/yunzhan-apps --pattern "*-linux-amd64.tar.gz*" --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/integrity-business.py" "$root/integrity-business.py"
          cp "$fixture/cohort.json" "$root/cohort.json"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware and pinned actual browser
        run: |
          set -eu
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
          npm install --prefix "$RUNNER_TEMP/c285-browser" --no-save --ignore-scripts --package-lock=false playwright-core@1.62.1
          google-chrome --version
      - name: Actual signed integrity apps nonroot old FD ownership records and hard cold
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/legacy-upgrade-c301-public"
          node_cli=$(command -v node)
          sudo -n env PANEL_QA_NODE_BINARY="$node_cli" PANEL_QA_PLAYWRIGHT_CORE_ENTRY="file://$RUNNER_TEMP/c285-browser/node_modules/playwright-core/index.mjs" python3 -I -B scripts/native-integrity-c301-legacy-upgrade/kvm.py "$RUNNER_TEMP/legacy-upgrade-c301-signed" scripts/native-integrity-c301-legacy-upgrade "$RUNNER_TEMP/legacy-upgrade-c301-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c301-legacy-upgrade-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-upgrade-c301-public/
          retention-days: 14
          if-no-files-found: error
