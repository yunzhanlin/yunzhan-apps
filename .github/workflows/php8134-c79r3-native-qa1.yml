name: PHP 8.1.34 native panel installation and retained data
on:
  push:
    branches: [codex/php8134-c79r3-native-qa1]
    paths: [scripts/native-php8134-c79r3/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  php81:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-php8134-c79r3/download.py "$RUNNER_TEMP/php81-inputs" "$RUNNER_TEMP/php81-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-php8134-c79r3/bootstrap-original-install.py "$RUNNER_TEMP/php81-inputs" "$RUNNER_TEMP/php81-private" > "$RUNNER_TEMP/php81-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/php81-private/bootstrap-step.stderr"
      - name: Verify PHP-FPM, retained data and the old instance
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-php8134-c79r3/php81.py "$RUNNER_TEMP/php81-private" > "$RUNNER_TEMP/php81-private/php81-step.stdout" 2> "$RUNNER_TEMP/php81-private/php81-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-php8134-c79r3/finish.py "$RUNNER_TEMP/php81-private" "$RUNNER_TEMP/php81-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c79r3-php8134-native-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/php81-public/
          if-no-files-found: error
          retention-days: 14
