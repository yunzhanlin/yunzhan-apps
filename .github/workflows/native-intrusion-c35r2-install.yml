name: actual native C35r2 AMD64 Ubuntu22 signed programme and Anti-intrusion111

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-intrusion-c35r2-install.yml
      - scripts/native-intrusion-c35r2/**

permissions:
  contents: read

concurrency:
  group: native-intrusion-c35r2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the complete published original-key QA cohort without guest credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c35r2-assets"
          ready=false
          for attempt in $(seq 1 90); do
            if gh release view qa-intrusionubuntu22candidate35r2-20261030-qa1 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/country-release-status.json" 2>/dev/null && python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["isDraft"] is False and v["isPrerelease"] is True else 1)' "$RUNNER_TEMP/country-release-status.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          gh release download qa-intrusionubuntu22candidate35r2-20261030-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-intrusion-c35r2-assets"
          python3 - "$RUNNER_TEMP/native-intrusion-c35r2-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '11b4a49ea36138f5a3c115c54ded85baba41f555189dc7490b7f864e26a179d3'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == '3c8dbb9dacc68ad23a5904c99303f421703e48db39e3f4d0215d5013603b48a8'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Original-key C35 programme and exact shared native app QA verified; no credentials in guest payload')
          PY
      - name: Prepare hardware guest tools while preserving existing host services
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Fresh Ubuntu22 signed C35r2, real dualstack SSH enforcement, preserving configure and audited unban
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c35r2-public"
          sudo -n python3 -I -B scripts/native-intrusion-c35r2/kvm.py "$RUNNER_TEMP/native-intrusion-c35r2-assets" scripts/native-intrusion-c35r2 "$RUNNER_TEMP/native-intrusion-c35r2-public"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-intrusion-c35r2-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-intrusion-c35r2-public/
          retention-days: 7
          if-no-files-found: warn
