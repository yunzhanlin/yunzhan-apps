name: PHP80 and PHP81 C560 native isolated applications and clean cold
on:
  push:
    branches: [codex/php8-isolated-c560-native]
    paths: [.github/workflows/php8-isolated-c560-native.yml]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/php8-isolated-c560-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        system: [ubuntu24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-php8-isolated-c560
      - name: Download original exact current signed programme
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-php8-isolated-c560
          root="$RUNNER_TEMP/php8-isolated-c560-native-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-apachebuildstatuscandidate477-20261122-qa1
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/cohort.json" "$root/cohort.json"
          cp "$fixture/php-isolated-business.py" "$root/php-isolated-business.py"
          cp "$fixture/original-inventory-probe.php" "$root/original-inventory-probe.php"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated native hardware
        run: |
          set -eu
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual current native PHP80 and PHP81 signed store installs, website sync, domain and clean cold
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/php8-isolated-c560-native-public"
          sudo -n python3 -I -B scripts/native-php8-isolated-c560/kvm.py "$RUNNER_TEMP/php8-isolated-c560-native-signed" scripts/native-php8-isolated-c560 "$RUNNER_TEMP/php8-isolated-c560-native-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c560-php8-isolated-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/php8-isolated-c560-native-public/
          retention-days: 14
          if-no-files-found: error
