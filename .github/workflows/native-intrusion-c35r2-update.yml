name: actual native C35r2 QA3 AMD64 Ubuntu24 signed110-to111 preserved update

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-intrusion-c35r2-update.yml
      - scripts/native-intrusion-update-c35r2/**

permissions:
  contents: read

concurrency:
  group: native-intrusion-c35r2-update-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-update:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the complete published original-key QA cohort without guest credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c35r2-update-assets"
          ready=false
          for attempt in $(seq 1 90); do
            if gh release view qa-intrusionubuntu22candidate35r2-20261030-qa3 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/country-release-status.json" 2>/dev/null && python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["isDraft"] is False and v["isPrerelease"] is True else 1)' "$RUNNER_TEMP/country-release-status.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          gh release download qa-intrusionubuntu22candidate35r2-20261030-qa3 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-intrusion-c35r2-update-assets"
          gh release view qa-intrusionubuntu22candidate35r2-20261030-qa2 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/current-c35r2-programme-release.json"
          python3 -c 'import json,sys;v=json.load(open(sys.argv[1]));assert not v["isDraft"] and v["isPrerelease"] and v["targetCommitish"]=="da58c86d63e26db2869f3605f96f5e543690de10"' "$RUNNER_TEMP/current-c35r2-programme-release.json"
          gh release download qa-intrusionubuntu22candidate35r2-20261030-qa2 --repo yunzhanlin/yunzhan-apps --pattern 'panel-0.1.0-dev.proapps24intrusionubuntu22candidate35r2-linux-amd64.tar.gz*' --dir "$RUNNER_TEMP/native-intrusion-c35r2-update-assets"
          python3 - "$RUNNER_TEMP/native-intrusion-c35r2-update-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == 'adb4338fac69f6cea524f143f3f046e9fead909bf0093637768c4f7ddc27c67b'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == '3c8dbb9dacc68ad23a5904c99303f421703e48db39e3f4d0215d5013603b48a8'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Both original-key programme cohorts and exact native110-to111 QA verified; no credentials in guest payload')
          PY
      - name: Prepare hardware guest tools while preserving existing host services
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual Ubuntu24 signed110 install/SSH, preserving programme upgrade, signed111 store update
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c35r2-update-public"
          sudo -n python3 -I -B scripts/native-intrusion-update-c35r2/kvm.py "$RUNNER_TEMP/native-intrusion-c35r2-update-assets" scripts/native-intrusion-update-c35r2 "$RUNNER_TEMP/native-intrusion-c35r2-update-public"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-intrusion-c35r2-update-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-intrusion-c35r2-update-public/
          retention-days: 7
          if-no-files-found: warn
