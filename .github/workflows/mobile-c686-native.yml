name: Mobile C686 unchanged publisher APK real system provider upload lock cancel and late result
on:
  push:
    branches: [codex/mobile-c686-native]
    paths: [.github/workflows/mobile-c686-native.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-c686-${{ github.sha }}
  cancel-in-progress: false
jobs:
  current-native-client:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/mobile-c686-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      C68_UI_COHORT: C686
      C68_UI_API: '37'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: qa/native-mobile-c686
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Acquire exact original signed current programme and unchanged public publisher APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/c68-private" "$RUNNER_TEMP/c68-public"
          python3 -I -B qa/native-mobile-c686/backend/download-programme.py "$RUNNER_TEMP/c68-assets"
          python3 -I -B qa/native-mobile-c686/https/download-original-publisher-APK.py "$RUNNER_TEMP/c68-private"
      - name: Prepare official API37 image and owned KVM access
        run: |
          set -eu
          umask 077
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'system-images;android-37.0;default;x86_64' 'emulator' 'platform-tools' > "$RUNNER_TEMP/c68-private/SDK-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/SDK-preparation.stderr"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - name: One normal current signed backend install and own file management site
        run: |
          set -eu
          umask 077
          sudo -n env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B qa/native-mobile-c686/backend/prepare-real-panel.py "$RUNNER_TEMP/c68-assets" "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/real-panel-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/real-panel-preparation.stderr"
      - name: One temporary HTTPS endpoint for the isolated CI panel
        run: |
          set -eu
          umask 077
          python3 -I -B qa/native-mobile-c686/https/start-real-HTTPS-panel.py "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/HTTPS-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/HTTPS-preparation.stderr"
      - name: One owned emulator and exact original publisher signed APK
        run: |
          set -eu
          umask 077
          python3 -I -B qa/native-mobile-c686/https/start-owned-emulator.py "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/emulator-preparation.stdout" 2> "$RUNNER_TEMP/c68-private/emulator-preparation.stderr"
      - name: Actual native login file download provider readback privacy lock and stale result refusal
        run: |
          set -eu
          umask 077
          python3 -I -B qa/native-mobile-c686/https/android-release-real-ui.py "$RUNNER_TEMP/c68-private" > "$RUNNER_TEMP/c68-private/device-UI.stdout" 2> "$RUNNER_TEMP/c68-private/device-UI.stderr"
      - if: always()
        name: Independently preserve actual original backend and client evidence then close temporary HTTPS
        run: |
          set -eu
          umask 077
          mkdir -m 700 -p "$RUNNER_TEMP/c68-private" "$RUNNER_TEMP/c68-public"
          sudo -n env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps C68_UI_API=37 python3 -I -B qa/native-mobile-c686/https/finish-evidence.py "$RUNNER_TEMP/c68-private" "$RUNNER_TEMP/c68-public"
      - if: always()
        name: Stop only the owned emulator
        run: |
          if [ -f "$RUNNER_TEMP/c68-private/owned-emulator-intent.json" ]; then
            "${ANDROID_HOME:?}/platform-tools/adb" -s emulator-5554 emu kill
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c686-mobile-current-publisher-API37-${{ github.run_id }}
          path: ${{ runner.temp }}/c68-public/
          retention-days: 14
          if-no-files-found: error
