name: Signed MongoDB 8.0.38 archive restore on Ubuntu 26 AMD64 QA2
on:
  push:
    branches: [codex/mongodb8038-c173r2-native-qa2]
    paths: [scripts/native-mongodb-c173r2-qa2/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c173r2-mongodb-ubuntu26-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/mongodb8038-c173r2-native-qa2'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: scripts/native-mongodb-c173r2-qa2
      - name: Download the exact signed panel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-mongodb-c173r2-qa2
          root="$RUNNER_TEMP/mongodb-c173r2-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-mongodb8038candidate173r2-20261114-qa1
          test "$(git rev-parse HEAD^)" = "$(jq -r .published_head "$fixture/dispatch.json")"
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --pattern 'rabbitmq-migration-signed-release.py' --dir "$root"
          mv "$root/rabbitmq-migration-signed-release.py" "$root/signed-release.py"
          cp "$fixture/mongodb.py" "$root/mongodb.py"
          source_head=$(jq -r .qa_catalogue_head "$fixture/dispatch.json")
          test "$source_head" = c50c8fa851caeb77e70249cb0730f110bb80391f
          catalogue="https://raw.githubusercontent.com/yunzhanlin/yunzhan-apps/$source_head/candidate"
          fetch() {
            curl --fail --silent --show-error --max-time 60 --retry 2 --output "$root/$1" "$catalogue/$2"
          }
          fetch catalogue.json dist/catalog-v1.json
          fetch catalogue.bundle.json signatures/catalog-v1.bundle.json
          fetch catalogue.pub.pem signatures/catalog-v1.pub.pem
          fetch catalogue.sig signatures/catalog-v1.sig
          fetch mongo.manifest.json dist/apps/mongodb/8.0.38-compat1/manifest.json
          base64 --decode "$root/catalogue.sig" > "$root/catalogue.sig.bin"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware virtualization
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Verify signed MongoDB credentials, indexed data, restart and independent restore
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/mongodb-c173r2-public"
          sudo -n python3 -I -B scripts/native-mongodb-c173r2-qa2/kvm.py "$RUNNER_TEMP/mongodb-c173r2-signed" scripts/native-mongodb-c173r2-qa2 "$RUNNER_TEMP/mongodb-c173r2-public" ubuntu26
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c173r2-mongodb-native-ubuntu26-amd64-qa2-${{ github.run_id }}
          path: ${{ runner.temp }}/mongodb-c173r2-public/
          retention-days: 14
          if-no-files-found: warn
