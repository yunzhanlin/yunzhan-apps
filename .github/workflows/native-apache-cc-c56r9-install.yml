name: Actual C56r9 five OS native Apache CC and preserved Format1 programme upgrade

on:
  push:
    branches: [codex/apache-native-cc-c56r9-native]
    paths: [scripts/native-apache-cc-c56r9/dispatch.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-apache-cc-c56r9-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/apache-native-cc-c56r9-native'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26, debian13legacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify both actual native source jobs and original twelve nonempty execution files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/apache-cc-c56r9-ABI"
          gh api repos/yunzhanlin/yunzhan-apps/actions/runs/41628011688 > "$RUNNER_TEMP/apache-cc-c56r9-ABI/run.json"
          gh api repos/yunzhanlin/yunzhan-apps/actions/runs/41628011688/jobs?per_page=100 > "$RUNNER_TEMP/apache-cc-c56r9-ABI/jobs.json"
          gh api repos/yunzhanlin/yunzhan-apps/actions/runs/41628011688/artifacts > "$RUNNER_TEMP/apache-cc-c56r9-ABI/artifacts.json"
          gh run download 41628011688 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/apache-cc-c56r9-ABI/events"
          python3 -I -B scripts/native-apache-cc-c56r9/check-source-ci.py "$RUNNER_TEMP/apache-cc-c56r9-ABI"
      - name: Download and bind both original key signed programme cohorts and reviewed payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-apache-cc-c56r9-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/431844996 > "$RUNNER_TEMP/ApacheCC-C55r2-cohort.json"
          gh api repos/yunzhanlin/yunzhan-apps/releases/432619707 > "$RUNNER_TEMP/ApacheCC-C56r9-cohort.json"
          python3 - "$RUNNER_TEMP/ApacheCC-C55r2-cohort.json" "$RUNNER_TEMP/ApacheCC-C56r9-cohort.json" <<'PY'
          import json,sys
          for file,rid,tag,head in [(sys.argv[1],431844996,'qa-privatebackupcandidate55r2-20261103-qa1','95f63cf17c3305dc5d09f88499ecd5591b1a1db9'),(sys.argv[2],432619707,'qa-apachelatecachecandidate56r9-20261103-qa1','681c1d2c2833f07d6a7d8be3190bca73cc8005e6')]:
              v=json.load(open(file));assert v['id']==rid and v['tag_name']==tag and v['target_commitish']==head and not v['draft']and v['prerelease']and len(v['assets'])==7
          PY
          gh release download qa-privatebackupcandidate55r2-20261103-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*linux-amd64.tar.gz*' --dir "$RUNNER_TEMP/native-apache-cc-c56r9-assets"
          gh release download qa-apachelatecachecandidate56r9-20261103-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*linux-amd64.tar.gz*' --pattern release-signing-dev.pub --dir "$RUNNER_TEMP/native-apache-cc-c56r9-assets"
          cp scripts/native-apache-cc-c56r9/guest.py scripts/native-apache-cc-c56r9/acceptance.py scripts/native-apache-cc-c56r9/cold.py scripts/native-apache-cc-c56r9/boot-transition.py scripts/native-apache-cc-c56r9/casebook.py scripts/native-apache-cc-c56r9/capture.py scripts/native-apache-cc-c56r9/preservation.py "$RUNNER_TEMP/native-apache-cc-c56r9-assets/"
          cp candidate/panel-integration-load-balance/packaging/signed-release.py "$RUNNER_TEMP/native-apache-cc-c56r9-assets/"
          cp scripts/native-apache-cc-c56r9/payload.json "$RUNNER_TEMP/native-apache-cc-c56r9-assets/assets.json"
          python3 - "$RUNNER_TEMP/native-apache-cc-c56r9-assets" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert sha(root/'assets.json')=='003ae7951608786953ffb19858a5d5537ad9094bd4b7022ecd082dc8a0f5d81e'
          manifest=json.loads((root/'assets.json').read_bytes());assert manifest['source_inputs_sha256']=='1f3cca6b0b4d953183de2101ca5855c80fd1e15e7c86b998b825068f66c6aec1'and len(manifest['files'])==15
          for n,h in manifest['files'].items():
              assert pathlib.PurePath(n).name==n and sha(root/n)==h
              if n.endswith('.py'):ast.parse((root/n).read_bytes())
          source=pathlib.Path('scripts/native-apache-cc-c56r9')
          assert sha(source/'kvm.py')=='30fd27701d61cc1922ac9ebf0e8bf23f4fa0ba5825b5f05be0c5224744f7da16'
          for n in('guest.py','acceptance.py','cold.py','boot-transition.py','casebook.py','capture.py','preservation.py'):assert (root/n).read_bytes()==(source/n).read_bytes()
          print('Original signed C55r2 and C56r9 cohorts and once-only Apache CC native payload verified')
          PY
      - name: Prepare native KVM hardware tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual signed factory or preserved legacy programme upgrade, body168 requests, native CC and VM powerloss
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-apache-cc-c56r9-public"
          sudo -n python3 -I -B scripts/native-apache-cc-c56r9/kvm.py "$RUNNER_TEMP/native-apache-cc-c56r9-assets" scripts/native-apache-cc-c56r9 "$RUNNER_TEMP/native-apache-cc-c56r9-public" "$OS_CASE"
      - name: Retain public proof and encrypted original guest evidence including failed cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-apache-cc-c56r9-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-apache-cc-c56r9-public/
          retention-days: 7
          if-no-files-found: error
