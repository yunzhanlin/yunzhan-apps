name: Four native PHP 5 compatibility applications
on:
  push:
    branches: [codex/php5-c90-native-qa2]
    paths: [scripts/native-php5-c90/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  legacy-php:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        slot: ['52', '53', '54', '55']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-php5-c90/download.py "$RUNNER_TEMP/legacy-php-inputs" "$RUNNER_TEMP/legacy-php-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-php5-c90/bootstrap-original-install.py "$RUNNER_TEMP/legacy-php-inputs" "$RUNNER_TEMP/legacy-php-private" > "$RUNNER_TEMP/legacy-php-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/legacy-php-private/bootstrap-step.stderr"
      - name: Verify PHP-FPM, retained data and the old instance
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-php5-c90/legacy-php.py "$RUNNER_TEMP/legacy-php-private" "$SLOT" > "$RUNNER_TEMP/legacy-php-private/legacy-php-step.stdout" 2> "$RUNNER_TEMP/legacy-php-private/legacy-php-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-php5-c90/finish.py "$RUNNER_TEMP/legacy-php-private" "$RUNNER_TEMP/legacy-php-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c90-native-php5-qa2-${{ matrix.slot }}-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-php-public/
          if-no-files-found: error
          retention-days: 14
