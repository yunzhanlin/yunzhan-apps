name: OpenLiteSpeed native website and WebAdmin PHP versions
on:
  push:
    branches: [codex/openlitespeed-c92-php-native-preflight]
    paths: [scripts/openlitespeed-c92-versions.sh]
permissions:
  contents: read
jobs:
  version-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify both exact native image executables
        run: bash scripts/openlitespeed-c92-versions.sh
      - name: Retain original observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c92-ols-php-versions-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c92-ols-php-version/
          if-no-files-found: error
          retention-days: 14
