name: Signed Task Manager inventories on native Linux
on:
  push:
    branches: [codex/task-manager-c100-native-qa1]
    paths: [scripts/native-task-manager-c100/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  task-manager:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-task-manager-c100/download.py "$RUNNER_TEMP/task-manager-inputs" "$RUNNER_TEMP/task-manager-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-task-manager-c100/bootstrap-original-install.py "$RUNNER_TEMP/task-manager-inputs" "$RUNNER_TEMP/task-manager-private" > "$RUNNER_TEMP/task-manager-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/task-manager-private/bootstrap-step.stderr"
      - name: Verify process snapshots and actual host inventories
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-task-manager-c100/task-manager.py "$RUNNER_TEMP/task-manager-private" > "$RUNNER_TEMP/task-manager-private/task-manager-step.stdout" 2> "$RUNNER_TEMP/task-manager-private/task-manager-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-task-manager-c100/finish.py "$RUNNER_TEMP/task-manager-private" "$RUNNER_TEMP/task-manager-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c100-native-task-manager-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/task-manager-public/
          if-no-files-found: error
          retention-days: 14
