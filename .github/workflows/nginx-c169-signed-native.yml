name: Signed Nginx interrupted log inspection
on:
  push:
    branches: [codex/nginx-log-mobile-c169-signed-native]
    paths: [scripts/native-nginx-c169/cohort.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: c169-nginx-log-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-nginx:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/nginx-log-mobile-c169-signed-native'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Bind original signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: python3 -I -B scripts/native-nginx-c169/download.py "$RUNNER_TEMP/c71-original-inputs" "$RUNNER_TEMP/c71-private"
      - name: Install the original signed panel once with normal platform guards
        run: |
          set -eu
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-nginx-c169/bootstrap-original-install.py "$RUNNER_TEMP/c71-original-inputs" "$RUNNER_TEMP/c71-private" > "$RUNNER_TEMP/c71-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/c71-private/bootstrap-step.stderr"
      - name: Load the pinned browser driver
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm install --prefix "$RUNNER_TEMP/c169-chrome" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
          google-chrome --version
      - name: Exercise actual Nginx log interruption and archive retention
        run: |
          set -eu
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-nginx-c169/nginx.py "$RUNNER_TEMP/c71-private"
      - name: Continue the original operation through real Chrome at 390 pixels
        if: matrix.os == 'ubuntu-24.04'
        run: sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps "$(command -v node)" scripts/native-nginx-c169/chrome.mjs "$RUNNER_TEMP/c71-private" "$RUNNER_TEMP/c169-chrome/node_modules/playwright-core/index.mjs"
      - name: Encrypt original observations including any refusal
        if: always()
        run: sudo python3 -I -B scripts/native-nginx-c169/finish.py "$RUNNER_TEMP/c71-private" "$RUNNER_TEMP/c71-public" phase1
      - name: Retain the original outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c169-native-nginx-log-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c71-public/
          retention-days: 14
          if-no-files-found: error
