name: Current signed Docker network volume and lifecycle
on:
  push:
    branches: [codex/docker-network-volume-c225-native]
    paths: [scripts/native-docker-c225/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  docker:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original signed programme and exact fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-docker-c225/download.py "$RUNNER_TEMP/docker-c225-inputs" "$RUNNER_TEMP/docker-c225-private"
      - name: Retain original hosted runner engine state and prepare clean native installation
        run: sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps RUNNER_ENVIRONMENT=github-hosted python3 -I -B scripts/native-docker-c225/prepare-fresh-docker.py "$RUNNER_TEMP/docker-c225-private"
      - name: Install exact original signed programme
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-docker-c225/bootstrap-original-install.py "$RUNNER_TEMP/docker-c225-inputs" "$RUNNER_TEMP/docker-c225-private" > "$RUNNER_TEMP/docker-c225-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/docker-c225-private/bootstrap-step.stderr"
      - name: Actual signed Docker app network volume and lifecycle business
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-docker-c225/docker-business.py "$RUNNER_TEMP/docker-c225-private" > "$RUNNER_TEMP/docker-c225-private/docker-step.stdout" 2> "$RUNNER_TEMP/docker-c225-private/docker-step.stderr"
      - name: Encrypt complete original evidence including failures
        if: always()
        run: sudo python3 -I -B scripts/native-docker-c225/finish.py "$RUNNER_TEMP/docker-c225-private" "$RUNNER_TEMP/docker-c225-public" phase1
      - name: Upload encrypted originals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c225-native-docker-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-c225-public/
          if-no-files-found: error
          retention-days: 14
