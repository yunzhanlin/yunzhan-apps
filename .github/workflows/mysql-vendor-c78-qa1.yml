name: Verify Oracle MySQL 8.4.13 upstream signatures
on:
  push:
    branches: [codex/mysql-vendor-c78-qa1]
    paths: [scripts/native-mysql-vendor-c78/verify.py]
permissions:
  contents: read
jobs:
  oracle-signature:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the original Oracle artifact and detached signature
        run: python3 -I -B scripts/native-mysql-vendor-c78/verify.py "$RUNNER_TEMP/mysql-original" "$RUNNER_TEMP/mysql-proof"
      - name: Retain the original vendor signature results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c78-mysql-vendor-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mysql-proof/
          if-no-files-found: error
          retention-days: 14
