name: Signed Nginx log rotation on Debian 12 and Ubuntu 26 AMD64
on:
  push:
    branches: [codex/nginx-c185-ordinary-logs-amd64]
    paths: [scripts/native-nginx-c185/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c185-nginx-matrix-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/nginx-c185-ordinary-logs-amd64'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        system: [debian12, ubuntu26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
          sparse-checkout: scripts/native-nginx-c185
      - name: Download the exact signed panel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-nginx-c185
          root="$RUNNER_TEMP/nginx-c185-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-redispersistencecandidate183-20261115-qa1
          test "$(git rev-parse HEAD^^^)" = "$(jq -r .published_head "$fixture/dispatch.json")"
          release_api="repos/yunzhanlin/yunzhan-apps/releases/tags/$tag"
          for attempt in $(seq 1 20); do
            if gh api "$release_api" --jq '.draft == false and .prerelease == true and (.assets | length) == 8' > "$root/release-ready" && grep -qx true "$root/release-ready"; then
              break
            fi
            sleep 20
          done
          grep -qx true "$root/release-ready"
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --pattern 'rabbitmq-migration-signed-release.py' --dir "$root"
          mv "$root/rabbitmq-migration-signed-release.py" "$root/signed-release.py"
          cp "$fixture/nginx.py" "$root/nginx.py"
          source_head=$(jq -r .qa_catalogue_head "$fixture/dispatch.json")
          test "$source_head" = 7cd2f7b2d4d03230b7ce24c021b0b462d8fe05c3
          catalogue="https://raw.githubusercontent.com/yunzhanlin/yunzhan-apps/$source_head/candidate"
          fetch() {
            curl --fail --silent --show-error --max-time 60 --retry 2 --output "$root/$1" "$catalogue/$2"
          }
          fetch catalogue.json dist/catalog-v1.json
          fetch catalogue.bundle.json signatures/catalog-v1.bundle.json
          fetch catalogue.pub.pem signatures/catalog-v1.pub.pem
          fetch catalogue.sig signatures/catalog-v1.sig
          fetch nginx.manifest.json dist/apps/nginx/1.30.6-compat1/manifest.json
          base64 --decode "$root/catalogue.sig" > "$root/catalogue.sig.bin"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware virtualization
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Verify signed Nginx logs and archive safety
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/nginx-c185-public"
          sudo -n python3 -I -B scripts/native-nginx-c185/kvm.py "$RUNNER_TEMP/nginx-c185-signed" scripts/native-nginx-c185 "$RUNNER_TEMP/nginx-c185-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c185-nginx-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/nginx-c185-public/
          retention-days: 14
          if-no-files-found: warn
