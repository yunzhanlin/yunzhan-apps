name: Load Balance C379 shared Nginx identity log cleanup memory and unprivileged reload contracts
on:
  push:
    branches: [codex/load-balance-c376-installed]
    paths: [.github/workflows/load-balance-c379-shared-reader.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Exact already signed current programme SDK source
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/c379-original"
          python3 -I -B scripts/qa-apache-c265/verify-inputs.py > "$RUNNER_TEMP/c379-original/source-proof.json"
      - name: Core and TCP UDP bounded wire renderer scheduler contracts
        working-directory: candidate/panel-integration-compose-signed-image
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c379-original"
          go test ./internal/executor -run '^TestWAFReload' -count=1 -v > "$out/nonroot-reload.stdout" 2>&1
          build="$RUNNER_TEMP/c379-build"
          mkdir -m 700 "$build"
          go test -c ./internal/executor -o "$build/executor.test"
          sha256sum "$build/executor.test" > "$out/executor-test.sha256"
          native=$(sudo mktemp -d /var/tmp/c379-owned-native-XXXXXX)
          sudo chmod 0755 "$native"
          sudo install -m 0555 "$build/executor.test" "$native/executor.test"
          (cd internal/executor && sudo env GOMAXPROCS=2 "$native/executor.test" -test.run '^Test(LogCleanup|WAFCountryMemory|LoadBalanceStreamControlPort)' -test.v -test.timeout 1200s > "$out/root-native-private-contracts.stdout" 2>&1)
          sudo rm "$native/executor.test"
          sudo rmdir "$native"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c379-load-balance-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c379-original/
          if-no-files-found: error
          retention-days: 14
