name: Actual C55r2 five OS private backup factory and preserved legacy upgrade

on:
  push:
    branches: [codex/private-backup-c55r2-native]
    paths: [scripts/native-private-backup-c55r2/dispatch.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-private-backup-c55r2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/private-backup-c55r2-native'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26, debian13upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify both actual native source jobs and original six nonempty execution files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/private-backup-c55r2-ABI"
          gh api repos/yunzhanlin/yunzhan-apps/actions/runs/41503343033 > "$RUNNER_TEMP/private-backup-c55r2-ABI/run.json"
          gh api repos/yunzhanlin/yunzhan-apps/actions/runs/41503343033/artifacts > "$RUNNER_TEMP/private-backup-c55r2-ABI/artifacts.json"
          gh run download 41503343033 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/private-backup-c55r2-ABI/events"
          python3 -I -B scripts/native-private-backup-c55r2/check-source-ci.py "$RUNNER_TEMP/private-backup-c55r2-ABI"
      - name: Download and bind both original key signed programme cohorts and reviewed payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-private-backup-c55r2-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/431668180 > "$RUNNER_TEMP/private-backup-C54-cohort.json"
          gh api repos/yunzhanlin/yunzhan-apps/releases/431844996 > "$RUNNER_TEMP/private-backup-C55r2-cohort.json"
          python3 - "$RUNNER_TEMP/private-backup-C54-cohort.json" "$RUNNER_TEMP/private-backup-C55r2-cohort.json" <<'PY'
          import json,sys
          for file,rid,tag,head in [(sys.argv[1],431668180,'qa-backupretentioncandidate54-20261103-qa1','4610c0ede2df6a9c6661ff181b1106d81261f881'),(sys.argv[2],431844996,'qa-privatebackupcandidate55r2-20261103-qa1','95f63cf17c3305dc5d09f88499ecd5591b1a1db9')]:
              v=json.load(open(file));assert v['id']==rid and v['tag_name']==tag and v['target_commitish']==head and not v['draft']and v['prerelease']and len(v['assets'])==7
          PY
          gh release download qa-backupretentioncandidate54-20261103-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*linux-amd64.tar.gz*' --dir "$RUNNER_TEMP/native-private-backup-c55r2-assets"
          gh release download qa-privatebackupcandidate55r2-20261103-qa1 --repo yunzhanlin/yunzhan-apps --pattern '*linux-amd64.tar.gz*' --pattern release-signing-dev.pub --dir "$RUNNER_TEMP/native-private-backup-c55r2-assets"
          cp scripts/native-private-backup-c55r2/guest.py scripts/native-private-backup-c55r2/business.py scripts/native-private-backup-c55r2/baseline-business.py scripts/native-private-backup-c55r2/cold.py scripts/native-private-backup-c55r2/install-observers.py scripts/native-private-backup-c55r2/capture.py scripts/native-private-backup-c55r2/preservation.py "$RUNNER_TEMP/native-private-backup-c55r2-assets/"
          cp candidate/panel-integration-load-balance/packaging/signed-release.py "$RUNNER_TEMP/native-private-backup-c55r2-assets/"
          cp scripts/native-private-backup-c55r2/payload.json "$RUNNER_TEMP/native-private-backup-c55r2-assets/assets.json"
          python3 - "$RUNNER_TEMP/native-private-backup-c55r2-assets" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert sha(root/'assets.json')=='43c88512c9eaf841c1b68fff57a970bbaf355cb42ee51a7a16564181cd72f0da'
          manifest=json.loads((root/'assets.json').read_bytes());assert manifest['source_inputs_sha256']=='f9095bc9eb5c59529d900cff4026846451f9d5fab793ecc81283d4cc674457e6'and len(manifest['files'])==15
          for n,h in manifest['files'].items():
              assert pathlib.PurePath(n).name==n and sha(root/n)==h
              if n.endswith('.py'):ast.parse((root/n).read_bytes())
          source=pathlib.Path('scripts/native-private-backup-c55r2')
          assert sha(source/'kvm.py')=='728d14f4eb7cc5e9874b791ff00e2e8419b7b8aa5a00ec3305ac031f79f86dc8'
          for n in('guest.py','business.py','baseline-business.py','cold.py','install-observers.py','capture.py','preservation.py'):assert (root/n).read_bytes()==(source/n).read_bytes()
          print('Original signed C54 and C55r2 cohorts and once-only private-backup QA payload verified')
          PY
      - name: Prepare native KVM hardware tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Actual signed factory or preserved legacy upgrade, real backups, Root privacy, Core and VM crashes
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-private-backup-c55r2-public"
          sudo -n python3 -I -B scripts/native-private-backup-c55r2/kvm.py "$RUNNER_TEMP/native-private-backup-c55r2-assets" scripts/native-private-backup-c55r2 "$RUNNER_TEMP/native-private-backup-c55r2-public" "$OS_CASE"
      - name: Retain public proof and encrypted original guest evidence including failed cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-private-backup-c55r2-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-private-backup-c55r2-public/
          retention-days: 7
          if-no-files-found: error
