name: Native PHP 5 source and isolation matrix
on:
  push:
    branches: [codex/php5-source-c87-qa3]
    paths: [.github/workflows/php5-source-c87-qa3.yml]
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        php:
          - { version: '5.5.38', slot: '55' }
          - { version: '5.4.45', slot: '54' }
          - { version: '5.3.29', slot: '53' }
          - { version: '5.2.17', slot: '52' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and run the native compatibility image
        env:
          VERSION: ${{ matrix.php.version }}
          SLOT: ${{ matrix.php.slot }}
        run: bash scripts/native-php5-c87/native.sh "$RUNNER_TEMP/php-proof" "$VERSION" "$SLOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c87-qa3-native-php5-${{ matrix.php.version }}-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/php-proof/
          if-no-files-found: error
          retention-days: 14
