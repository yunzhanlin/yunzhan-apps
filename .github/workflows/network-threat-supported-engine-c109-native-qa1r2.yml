name: Signed Suricata 8.0.8 and passive IDS on native Linux
on:
  push:
    branches: [codex/network-threat-supported-engine-c109-native-qa1r2]
    paths: [scripts/native-network-threat-supported-engine-c109/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  network-threat-supported-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-network-threat-supported-engine-c109/download.py "$RUNNER_TEMP/network-threat-supported-engine-inputs" "$RUNNER_TEMP/network-threat-supported-engine-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-network-threat-supported-engine-c109/bootstrap-original-install.py "$RUNNER_TEMP/network-threat-supported-engine-inputs" "$RUNNER_TEMP/network-threat-supported-engine-private" > "$RUNNER_TEMP/network-threat-supported-engine-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/network-threat-supported-engine-private/bootstrap-step.stderr"
      - name: Verify the vendor engine and passive IDS on real loopback traffic
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-network-threat-supported-engine-c109/network-threat-supported-engine.py "$RUNNER_TEMP/network-threat-supported-engine-private" > "$RUNNER_TEMP/network-threat-supported-engine-private/network-threat-supported-engine-step.stdout" 2> "$RUNNER_TEMP/network-threat-supported-engine-private/network-threat-supported-engine-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-network-threat-supported-engine-c109/finish.py "$RUNNER_TEMP/network-threat-supported-engine-private" "$RUNNER_TEMP/network-threat-supported-engine-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c109-native-network-threat-supported-engine-qa1r2-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/network-threat-supported-engine-public/
          if-no-files-found: error
          retention-days: 14
