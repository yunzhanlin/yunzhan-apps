name: Test and publish reviewed PHP 5.4–7.3 compatibility images
on:
  push:
    branches: [codex/php54-73-c98-image-release]
    paths: [.github/workflows/php54-73-c98-image-release.yml]
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        php:
          - { slot: '54', version: '5.4.45', cohort: c98 }
          - { slot: '55', version: '5.5.38', cohort: c98 }
          - { slot: '56', version: '5.6.40', cohort: c98 }
          - { slot: '70', version: '7.0.33', cohort: c96 }
          - { slot: '71', version: '7.1.33', cohort: c96 }
          - { slot: '72', version: '7.2.34', cohort: c96 }
          - { slot: '73', version: '7.3.33', cohort: c96 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SLOT: ${{ matrix.php.slot }}
      PHP_RELEASE_VERSION: ${{ matrix.php.version }}
      COHORT: ${{ matrix.php.cohort }}
      IMAGE: ghcr.io/yunzhanlin/yunzhan-apps-php${{ matrix.php.slot }}
      RELEASE_TAG: ${{ matrix.php.version }}-compat3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build and test PHP HTTP, uploads, restart and SQL drivers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 97ede3c49f68daaa6a41f2b7a6d63e6543bdb720
          bash "scripts/php-$COHORT/proof.sh" "$SLOT" "$PHP_RELEASE_VERSION"
          bash "scripts/php-$COHORT/database.sh" "$PHP_RELEASE_VERSION"
      - name: Publish the tested architecture image and verify remote digest
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/registry-auth.XXXXXX")"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset PACKAGE_TOKEN
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          if [[ $COHORT == c96 ]]; then
            local_image=local/c96-php:verified
          else
            local_image="local/c98-php$SLOT:verified"
          fi
          tag="$IMAGE:$RELEASE_TAG-$arch"
          image_id="$(docker image inspect --format '{{.Id}}' "$local_image")"
          docker tag "$local_image" "$tag"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$image_id"
          out="$RUNNER_TEMP/$COHORT-php-proof"
          docker push "$tag" > "$out/original-registry-push.txt"
          docker image inspect --format '{{json .RepoDigests}}' "$tag" > "$out/remote-repo-digests.json"
          docker buildx imagetools inspect --raw "$tag" > "$out/original-remote-image.json"
          python3 -I -B - "$out" "$IMAGE" "$arch" "$image_id" "$PHP_RELEASE_VERSION" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          image, arch, image_id, version = sys.argv[2:]
          proof = json.loads((root / 'original-proof.json').read_bytes())
          assert proof['ok'] and proof['architecture'] == arch and proof['php'] == version
          assert all(proof[key] for key in ('php_fpm_http','multipart_upload','restart_data_preserved'))
          feature = 'legacy_and_current_mysql_drivers_loaded' if version.startswith('5.') else 'patched_opcache_loaded'
          assert proof[feature]
          database = json.loads((root / 'original-database.json').read_bytes())
          assert database == {'php':version,'pdo_write_mysqli_read':True,'mysqli_update_pdo_read':True}
          raw = (root / 'original-remote-image.json').read_bytes()
          digest = 'sha256:' + hashlib.sha256(raw).hexdigest()
          assert image + '@' + digest in json.loads((root / 'remote-repo-digests.json').read_bytes())
          assert json.loads(raw)['config']['digest'] == image_id
          (root / 'original-published-image.json').write_text(json.dumps({'arch':arch,'digest':digest,'image_id':image_id})+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c98-php${{ matrix.php.slot }}-image-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ matrix.php.cohort }}-php-proof/
          if-no-files-found: error
          retention-days: 14
  index:
    needs: image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Publish architecture indexes for the tested images
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/registry-auth.XXXXXX")"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset PACKAGE_TOKEN
          output="$RUNNER_TEMP/c98-php-index"
          mkdir -m 700 "$output"
          for pair in 54:5.4.45 55:5.5.38 56:5.6.40 70:7.0.33 71:7.1.33 72:7.2.34 73:7.3.33; do
            slot="${pair%%:*}"
            version="${pair#*:}"
            image="ghcr.io/yunzhanlin/yunzhan-apps-php$slot"
            tag="$image:$version-compat3"
            out="$output/$slot"
            mkdir -m 700 "$out"
            docker buildx imagetools inspect --raw "$tag-amd64" > "$out/amd64.json"
            docker buildx imagetools inspect --raw "$tag-arm64" > "$out/arm64.json"
            amd="$(sha256sum "$out/amd64.json")"; amd="${amd%% *}"
            arm="$(sha256sum "$out/arm64.json")"; arm="${arm%% *}"
            docker buildx imagetools create --tag "$tag" "$image@sha256:$amd" "$image@sha256:$arm"
            docker buildx imagetools inspect --raw "$tag" > "$out/original-index.json"
            python3 -I -B - "$out" "$amd" "$arm" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          raw = (root / 'original-index.json').read_bytes()
          entries = json.loads(raw)['manifests']
          assert len(entries) == 2 and all(x['platform']['os'] == 'linux' for x in entries)
          platforms = {x['platform']['architecture']:x['digest'] for x in entries}
          assert platforms == {'amd64':'sha256:'+sys.argv[2], 'arm64':'sha256:'+sys.argv[3]}
          (root / 'original-index-proof.json').write_text(json.dumps({'digest':'sha256:'+hashlib.sha256(raw).hexdigest(),'platforms':platforms})+'\n')
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c98-php-index-${{ github.run_id }}
          path: ${{ runner.temp }}/c98-php-index/
          if-no-files-found: error
          retention-days: 14
