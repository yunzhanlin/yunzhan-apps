name: Signed NFS site reference and external mount guards
on:
  push:
    branches: [codex/nfs-c208-reference-guards-native]
    paths: [scripts/native-nfs-c208-guards/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c208-nfs-guards-matrix-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/nfs-c208-reference-guards-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        system: [ubuntu24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout: |
            scripts/native-nfs-c208-guards
            candidate/panel-integration-compose-signed-image
      - name: Download the exact signed panel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-nfs-c208-guards
          root="$RUNNER_TEMP/nfs-c208-guards-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-nfspreflightcandidate208-20261120-qa1
          published=$(jq -r .published_head "$fixture/dispatch.json")
          git merge-base --is-ancestor "$published" HEAD
          git diff --exit-code "$published" HEAD -- candidate/panel-integration-compose-signed-image candidate/dist candidate/signatures dist signatures
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/payload.json" "$root/assets.json"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run exact-source native Root NFS and queued-operation regressions
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2 -buildvcs=false'
        run: |
          set -euo pipefail
          fixture=scripts/native-nfs-c208-guards
          sdk="$GITHUB_WORKSPACE/candidate/panel-integration-compose-signed-image"
          mkdir -m700 "$RUNNER_TEMP/nfs-c208-guards-unit-public"
          python3 -I -B "$fixture/verify_sdk.py" "$sdk" "$fixture/dispatch.json" > "$RUNNER_TEMP/nfs-c208-guards-unit-public/source.json"
          (cd "$sdk"; go test -c -trimpath -o "$RUNNER_TEMP/nfs-guards.tests" ./internal/executor)
          sudo -n "$RUNNER_TEMP/nfs-guards.tests" -test.run='^(TestNFSSiteArchivePreflightMatchesExecutionAndPreservesData|TestQueuedModuleOperationCannotRunAfterUninstall|TestNFS|TestArchiveSite|TestWAFSiteArchive)' -test.v -test.count=1 > "$RUNNER_TEMP/nfs-c208-guards-unit-public/native.stdout"
          test "$(grep -c -- '--- PASS:' "$RUNNER_TEMP/nfs-c208-guards-unit-public/native.stdout")" = 50
      - name: Prepare isolated hardware virtualization
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Verify signed NFS reference, directory identity and external mount guards
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/nfs-c208-guards-public"
          sudo -n python3 -I -B scripts/native-nfs-c208-guards/kvm.py "$RUNNER_TEMP/nfs-c208-guards-signed" scripts/native-nfs-c208-guards "$RUNNER_TEMP/nfs-c208-guards-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c208-nfs-guards-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nfs-c208-guards-public/
            ${{ runner.temp }}/nfs-c208-guards-unit-public/
          retention-days: 14
          if-no-files-found: warn
