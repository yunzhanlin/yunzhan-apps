name: actual C43 AMD64 PM2 rollback and account matrix

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - scripts/native-pm2-c43/dispatch.json

permissions:
  contents: read

concurrency:
  group: native-pm2-c43-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download the original reviewed signed cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-pm2-c43-assets"
          gh api repos/yunzhanlin/yunzhan-apps/releases/430292185 > "$RUNNER_TEMP/cohort.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["id"]==430292185 and not v["draft"] and v["prerelease"] and v["tag_name"]=="qa-pm2rollbackstopcandidate43-20261101-qa1" and len(v["assets"])==7' "$RUNNER_TEMP/cohort.json"
          gh release download qa-pm2rollbackstopcandidate43-20261101-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-pm2-c43-assets"
          cp scripts/native-pm2-c43/guest.py scripts/native-pm2-c43/prepare.py scripts/native-pm2-c43/functional.py scripts/native-pm2-c43/capture.py "$RUNNER_TEMP/native-pm2-c43-assets/"
          cp candidate/panel-integration-load-balance/packaging/signed-release.py "$RUNNER_TEMP/native-pm2-c43-assets/"
          cp scripts/native-pm2-c43/payload.json "$RUNNER_TEMP/native-pm2-c43-assets/assets.json"
          python3 - "$RUNNER_TEMP/native-pm2-c43-assets" <<'PY'
          import ast,hashlib,json,pathlib,sys
          base=pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base/'assets.json').read_bytes()).hexdigest()=='a6a43e31410e0d44df1a7eebfb2f0a484c4a1e51195e11c01ecf3c46580c0f50'
          manifest=json.loads((base/'assets.json').read_bytes())
          assert manifest['source_inputs_sha256']=='84b9a7b8f98f15e3cfbaec993c2cd1e24468a68c1132473cdc28da41b56a9f93'
          for name,digest in manifest['files'].items():
              assert pathlib.PurePath(name).name==name
              assert hashlib.sha256((base/name).read_bytes()).hexdigest()==digest
          signer_pin_expression=ast.dump(ast.parse("sha(payload / 'signed-release.py')",mode='eval').body)
          signer_pins=[]
          for node in ast.walk(ast.parse((base/'guest.py').read_bytes())):
              if isinstance(node,ast.Assert) and isinstance(node.test,ast.Compare) and ast.dump(node.test.left)==signer_pin_expression:
                  assert len(node.test.ops)==len(node.test.comparators)==1 and isinstance(node.test.ops[0],ast.Eq) and isinstance(node.test.comparators[0],ast.Constant)
                  signer_pins.append(node.test.comparators[0].value)
          assert signer_pins==[manifest['files']['signed-release.py']]
          print('Original programme signatures, key and reviewed QA payload bound')
          PY
      - name: Prepare actual hardware guest tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Fresh normal programme, signed PM2 installation and real nonroot account/project journey
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-pm2-c43-public"
          sudo -n python3 -I -B scripts/native-pm2-c43/kvm.py "$RUNNER_TEMP/native-pm2-c43-assets" scripts/native-pm2-c43 "$RUNNER_TEMP/native-pm2-c43-public" "$OS_CASE"
      - name: Retain public proof and encrypted original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-pm2-c43-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-pm2-c43-public/
          retention-days: 7
          if-no-files-found: warn
