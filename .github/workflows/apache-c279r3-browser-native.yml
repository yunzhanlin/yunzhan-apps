name: Apache C279r3 actual signed store and runtime browser acceptance
on:
  push:
    branches: [codex/apache-c279r3-browser-native]
    paths: [scripts/native-apache-c279r3/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c279-apache-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/apache-c279r3-browser-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        system: [ubuntu22, debian13]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-apache-c279r3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download exact original signed programme cohorts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-apache-c279r3
          root="$RUNNER_TEMP/apache-c279-signed"
          mkdir -m 700 "$root"
          old=$(jq -r '.previous_tag' "$fixture/dispatch.json")
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$old" = qa-pm2archivecandidate232r2-20261120-qa1
          test "$tag" = qa-apache271candidate265r6-20261121-qa1
          gh release download "$old" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --dir "$root"
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --dir "$root"
          cp "$fixture/signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware and pinned browser observer
        run: |
          set -eu
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
          npm install --prefix "$RUNNER_TEMP/c279-browser" --no-save --ignore-scripts --package-lock=false playwright-core@1.62.1
          node --version
          google-chrome --version
      - name: Actual store button, actual runtime button and real hard cold recovery
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/apache-c279-public"
          node_cli=$(command -v node)
          sudo -n env PANEL_QA_NODE_BINARY="$node_cli" PANEL_QA_PLAYWRIGHT_CORE_ENTRY="file://$RUNNER_TEMP/c279-browser/node_modules/playwright-core/index.mjs" python3 -I -B scripts/native-apache-c279r3/kvm.py "$RUNNER_TEMP/apache-c279-signed" scripts/native-apache-c279r3 "$RUNNER_TEMP/apache-c279-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c279r3-apache-browser-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-c279-public/
          retention-days: 14
          if-no-files-found: warn
