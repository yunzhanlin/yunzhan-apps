name: Signed store reference recovery on native Linux
on:
  push:
    branches: [codex/store-reference-c101-native-qa1r4]
    paths: [scripts/native-store-reference-c101/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  store-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-store-reference-c101/download.py "$RUNNER_TEMP/store-reference-inputs" "$RUNNER_TEMP/store-reference-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-store-reference-c101/bootstrap-original-install.py "$RUNNER_TEMP/store-reference-inputs" "$RUNNER_TEMP/store-reference-private" > "$RUNNER_TEMP/store-reference-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/store-reference-private/bootstrap-step.stderr"
      - name: Exercise an actual peer TLS name alert and signed catalogue lookup
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-store-reference-c101/store-reference.py "$RUNNER_TEMP/store-reference-private" > "$RUNNER_TEMP/store-reference-private/store-reference-step.stdout" 2> "$RUNNER_TEMP/store-reference-private/store-reference-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-store-reference-c101/finish.py "$RUNNER_TEMP/store-reference-private" "$RUNNER_TEMP/store-reference-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c101-native-store-reference-qa1r4-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/store-reference-public/
          if-no-files-found: error
          retention-days: 14
