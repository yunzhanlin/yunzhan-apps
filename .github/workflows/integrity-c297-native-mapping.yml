name: Integrity C297 owned native immutable mappings
on:
  push:
    branches: [codex/integrity-c297-native-mapping-canary]
    paths: [scripts/native-integrity-c297/immutable-mapping.py]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/native-integrity-c297
      - name: Actual newly owned file mapping boundary
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/c297-original"
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps RUNNER_ENVIRONMENT=github-hosted python3 -I -B scripts/native-integrity-c297/immutable-mapping.py "$RUNNER_TEMP/c297-original"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c297-owned-mapping-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c297-original/
          if-no-files-found: error
          retention-days: 14
