name: PHP code security and site-specific FPM process restrictions
on:
  push:
    branches: [codex/php-process-c95r3-native-qa2]
    paths: [scripts/native-php-process-c95/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  php-process:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-php-process-c95/download.py "$RUNNER_TEMP/apache-runtime-inputs" "$RUNNER_TEMP/apache-runtime-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-php-process-c95/bootstrap-original-install.py "$RUNNER_TEMP/apache-runtime-inputs" "$RUNNER_TEMP/apache-runtime-private" > "$RUNNER_TEMP/apache-runtime-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/apache-runtime-private/bootstrap-step.stderr"
      - name: Exercise real PHP-FPM before, during and after site policy changes
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-php-process-c95/php-process.py "$RUNNER_TEMP/apache-runtime-private" > "$RUNNER_TEMP/apache-runtime-private/apache-runtime-step.stdout" 2> "$RUNNER_TEMP/apache-runtime-private/apache-runtime-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-php-process-c95/finish.py "$RUNNER_TEMP/apache-runtime-private" "$RUNNER_TEMP/apache-runtime-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c95r3-native-php-process-qa2-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-runtime-public/
          if-no-files-found: error
          retention-days: 14
