name: Signed file daily inotify and retained history
on:
  push:
    branches: [codex/daily-c198-quota-and-bandwidth-native]
    paths: [scripts/native-daily-c198/dispatch.json]
permissions:
  contents: read
concurrency:
  group: c198-daily-matrix-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/daily-c198-quota-and-bandwidth-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        system: [debian12, ubuntu24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 3
          sparse-checkout: scripts/native-daily-c198
      - name: Download the exact signed panel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          fixture=scripts/native-daily-c198
          root="$RUNNER_TEMP/daily-c198-signed"
          mkdir -m 700 "$root"
          tag=$(jq -r '.tag' "$fixture/dispatch.json")
          test "$tag" = qa-ftpfilequotacandidate195r2-20261115-qa1
          published=$(jq -r .published_head "$fixture/dispatch.json")
          git merge-base --is-ancestor "$published" HEAD
          git diff --exit-code "$published" HEAD -- candidate/panel-integration-compose-signed-image candidate/dist candidate/signatures dist signatures
          gh release download "$tag" --repo yunzhanlin/yunzhan-apps --pattern '*-linux-amd64.tar.gz*' --pattern 'release-signing-dev.pub' --pattern 'rabbitmq-migration-signed-release.py' --dir "$root"
          mv "$root/rabbitmq-migration-signed-release.py" "$root/signed-release.py"
          cp "$fixture/guest.py" "$root/guest.py"
          cp "$fixture/payload.json" "$root/assets.json"
      - name: Prepare isolated hardware virtualization
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Verify native daily changes and exact preboot history after power loss
        run: |
          set -eu
          mkdir -m 700 "$RUNNER_TEMP/daily-c198-public"
          sudo -n python3 -I -B scripts/native-daily-c198/kvm.py "$RUNNER_TEMP/daily-c198-signed" scripts/native-daily-c198 "$RUNNER_TEMP/daily-c198-public" "${{ matrix.system }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c198-daily-native-${{ matrix.system }}-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/daily-c198-public/
          retention-days: 14
          if-no-files-found: warn
