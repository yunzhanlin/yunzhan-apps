name: Load Balance C315 current native contracts with explicit test fixture correction
on:
  push:
    branches: [codex/load-balance-c315-native-fixture]
    paths: [.github/workflows/load-balance-c315-native-fixture.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Exact already signed current programme SDK source
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/c315-original"
          python3 -I -B scripts/qa-apache-c265/verify-inputs.py > "$RUNNER_TEMP/c315-original/source-proof.json"
          cd candidate/panel-integration-compose-signed-image
          git apply --check ../../scripts/load-balance-c315-native-fixture.patch
          git apply ../../scripts/load-balance-c315-native-fixture.patch
          test "$(git diff --name-only -- .)" = "candidate/panel-integration-compose-signed-image/internal/executor/load_balance_stream_upgrade_completion_linux_test.go"
          printf '%s  %s\n' 180c263e6c34eb92413d140c475631a15ee73a8990523d0cb96afe3004e6bea4 internal/executor/load_balance_stream_upgrade_completion_linux_test.go | sha256sum --check
          git diff --binary -- . > "$RUNNER_TEMP/c315-original/explicit-test-only-overlay.patch"
          printf '%s\n' 'Production source unchanged; one stale constructor fixture corrected after exact signed SDK verification. Not installed business qualification.' > "$RUNNER_TEMP/c315-original/overlay-scope.txt"
      - name: Core and TCP UDP bounded wire renderer scheduler contracts
        working-directory: candidate/panel-integration-compose-signed-image
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOMAXPROCS: '2'
          GOFLAGS: -p=2
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/c315-original"
          go test ./internal/core ./internal/appcatalog -run 'LoadBalance|SiteLoadBalance' -count=1 -v > "$out/core-and-catalogue.stdout" 2>&1
          go test ./internal/loadbalancestream -count=1 -v > "$out/stream-package.stdout" 2>&1
          build="$RUNNER_TEMP/c315-build"
          mkdir -m 700 "$build"
          go test -c ./internal/executor -o "$build/executor.test"
          sha256sum "$build/executor.test" > "$out/executor-test.sha256"
          native=$(sudo mktemp -d /var/tmp/c315-owned-native-XXXXXX)
          sudo chmod 0755 "$native"
          sudo install -m 0555 "$build/executor.test" "$native/executor.test"
          sudo env GOMAXPROCS=2 "$native/executor.test" -test.run '^Test(LoadBalance|SiteLoadBalance|Stream)' -test.v -test.timeout 1200s > "$out/root-native-private-contracts.stdout" 2>&1
          sudo rm "$native/executor.test"
          sudo rmdir "$native"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c315-load-balance-native-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c315-original/
          if-no-files-found: error
          retention-days: 14
