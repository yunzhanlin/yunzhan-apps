name: actual native C35r6 QA1 AMD64 Ubuntu24 automatic first-install SSH policy and signed Anti-intrusion111

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - .github/workflows/native-intrusion-c35r6-install.yml
      - scripts/native-intrusion-c35r6/**

permissions:
  contents: read

concurrency:
  group: native-intrusion-c35r6-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the complete published original-key QA cohort without guest credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c35r6-assets"
          ready=false
          for attempt in $(seq 1 90); do
            if gh release view qa-freshsshpolicycandidate35r6-20261030-qa1 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/country-release-status.json" 2>/dev/null && python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["isDraft"] is False and v["isPrerelease"] is True else 1)' "$RUNNER_TEMP/country-release-status.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          gh release download qa-freshsshpolicycandidate35r6-20261030-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-intrusion-c35r6-assets"
          python3 - "$RUNNER_TEMP/native-intrusion-c35r6-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '8d6df4fff6ab4a504e0bb98f55b6f5411fe9551b943e8c4885a7bae0ded0bf9b'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == 'f4af80ea3ec0e97a4802cbc044215d5b34fa9fcf512937e68edb635f5263a315'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Original-key C35 programme and exact shared native app QA verified; no credentials in guest payload')
          PY
      - name: Root first-install policy, actual assembled helper and existing WAF packaging fixtures
        run: |
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_fresh_ssh_policy.py
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_apache_body_cache_budget.py
          sudo python3 -I -B -m unittest discover -s candidate/panel-integration-load-balance/packaging -p test_waf_state_directory.py
      - name: Prepare hardware guest tools while preserving existing host services
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Fresh Ubuntu24 auto-loaded numeric SSH policy, real dualstack SSH enforcement, preserving configure and audited unban
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-intrusion-c35r6-public"
          sudo -n python3 -I -B scripts/native-intrusion-c35r6/kvm.py "$RUNNER_TEMP/native-intrusion-c35r6-assets" scripts/native-intrusion-c35r6 "$RUNNER_TEMP/native-intrusion-c35r6-public"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-intrusion-c35r6-amd64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-intrusion-c35r6-public/
          retention-days: 7
          if-no-files-found: warn
