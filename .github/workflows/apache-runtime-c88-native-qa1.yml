name: Apache and PHP signed native runtime and site
on:
  push:
    branches: [codex/apache-runtime-c88-native-qa1]
    paths: [scripts/native-apache-runtime-c88/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  native-apache:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-apache-runtime-c88/download.py "$RUNNER_TEMP/apache-runtime-inputs" "$RUNNER_TEMP/apache-runtime-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-apache-runtime-c88/bootstrap-original-install.py "$RUNNER_TEMP/apache-runtime-inputs" "$RUNNER_TEMP/apache-runtime-private" > "$RUNNER_TEMP/apache-runtime-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/apache-runtime-private/bootstrap-step.stderr"
      - name: Install Apache and PHP and exercise an actual managed website
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-apache-runtime-c88/apache-runtime.py "$RUNNER_TEMP/apache-runtime-private" > "$RUNNER_TEMP/apache-runtime-private/apache-runtime-step.stdout" 2> "$RUNNER_TEMP/apache-runtime-private/apache-runtime-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-apache-runtime-c88/finish.py "$RUNNER_TEMP/apache-runtime-private" "$RUNNER_TEMP/apache-runtime-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c88-native-apache-runtime-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/apache-runtime-public/
          if-no-files-found: error
          retention-days: 14
