name: C72 signed Docker credentials in native Chromium
on:
  push:
    branches: [codex/docker-credential-c72-native-qa3]
    paths: [scripts/native-docker-c72/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  credential-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download exact public signed release and Chromium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-docker-c72/download.py "$RUNNER_TEMP/c72-inputs" "$RUNNER_TEMP/c72-private"
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/native-docker-c72
      - name: Install original signed panel on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-docker-c72/bootstrap-original-install.py "$RUNNER_TEMP/c72-inputs" "$RUNNER_TEMP/c72-private" > "$RUNNER_TEMP/c72-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/c72-private/bootstrap-step.stderr"
      - name: Prepare pinned sandboxed Chromium on the signed Ubuntu archive
        run: |
          umask 077
          apt_config="$(sudo python3 -I -B -c 'import json,sys;print(json.load(open(sys.argv[1]))["path"])' "$RUNNER_TEMP/c72-private/isolated-ubuntu-apt-config.json")"
          sudo env APT_CONFIG="$apt_config" "$(command -v node)" scripts/native-docker-c72/node_modules/playwright-core/cli.js install-deps chromium > "$RUNNER_TEMP/c72-private/browser-dependencies.stdout" 2> "$RUNNER_TEMP/c72-private/browser-dependencies.stderr"
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-docker-c72/prepare-browser.py "$RUNNER_TEMP/c72-chromium.zip" "$RUNNER_TEMP/c72-private" > "$RUNNER_TEMP/c72-private/browser-prepare.stdout" 2> "$RUNNER_TEMP/c72-private/browser-prepare.stderr"
      - name: Install all three signed apps through the store and operate their credential dialogs
        run: |
          umask 077
          node scripts/native-docker-c72/browser.mjs "$RUNNER_TEMP/c72-private" > "$RUNNER_TEMP/c72-private/browser-step.stdout" 2> "$RUNNER_TEMP/c72-private/browser-step.stderr"
      - name: Encrypt the original test results
        if: always()
        run: sudo python3 -I -B scripts/native-docker-c72/finish.py "$RUNNER_TEMP/c72-private" "$RUNNER_TEMP/c72-public" phase1
      - name: Retain original native browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c72-qa3-native-credentials-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c72-public/
          retention-days: 14
          if-no-files-found: error
