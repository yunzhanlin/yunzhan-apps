name: C70 actual locked npm builder in a private conventional opt namespace
on:
  push:
    branches: [codex/pm2-c70-real-builder-qa6]
    paths: [qa/pm2-vendor-copy-source-binding.json]
permissions:
  contents: read
concurrency:
  group: c70-qa6-original-real-builder-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-native-root:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/pm2-c70-real-builder-qa6'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.2
          cache: false
      - name: Actual native locked npm build and unprivileged PM2 executable in an isolated mount namespace
        run: |
          set -eu
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps PATH="$(dirname "$(command -v go)"):/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" python3 -I -B tools/run-pm2-vendor-copy-native.py "$RUNNER_TEMP/c70-original-root"
      - name: Preserve every original Root output and metadata including failures
        if: always()
        run: sudo python3 -I -B tools/collect-pm2-vendor-copy-native.py "$RUNNER_TEMP/c70-original-root" "$RUNNER_TEMP/c70-original-root-public"
      - name: Upload original native Root outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c70-qa6-original-real-builder-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/c70-original-root-public/
          retention-days: 14
          if-no-files-found: error
