name: MySQL 8.4.13 native installation and original instance preservation
on:
  push:
    branches: [codex/mysql8413-c78r2-native-qa1]
    paths: [scripts/native-mysql8413-c78r2/cohort.json]
permissions:
  contents: read
  actions: read
jobs:
  mysql:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download the original signed programme
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 -I -B scripts/native-mysql8413-c78r2/download.py "$RUNNER_TEMP/mysql-inputs" "$RUNNER_TEMP/mysql-private"
      - name: Install the original signed programme on Linux
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-mysql8413-c78r2/bootstrap-original-install.py "$RUNNER_TEMP/mysql-inputs" "$RUNNER_TEMP/mysql-private" > "$RUNNER_TEMP/mysql-private/bootstrap-step.stdout" 2> "$RUNNER_TEMP/mysql-private/bootstrap-step.stderr"
      - name: Verify separate MySQL versions and actual SQL on both instances
        run: |
          umask 077
          sudo env GITHUB_ACTIONS=true GITHUB_REPOSITORY=yunzhanlin/yunzhan-apps python3 -I -B scripts/native-mysql8413-c78r2/mysql.py "$RUNNER_TEMP/mysql-private" > "$RUNNER_TEMP/mysql-private/mysql-step.stdout" 2> "$RUNNER_TEMP/mysql-private/mysql-step.stderr"
      - name: Encrypt the original evidence
        if: always()
        run: sudo python3 -I -B scripts/native-mysql8413-c78r2/finish.py "$RUNNER_TEMP/mysql-private" "$RUNNER_TEMP/mysql-public" phase1
      - name: Retain the original native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c78r2-mysql8413-native-qa1-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mysql-public/
          if-no-files-found: error
          retention-days: 14
