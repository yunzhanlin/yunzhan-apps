name: actual C40r2 AMD64 PHP security apps and FPM OS matrix

on:
  push:
    branches: [codex/app-candidate]
    paths:
      - scripts/native-php-c40r2/dispatch.json

permissions:
  contents: read

concurrency:
  group: native-php-c40r2-os-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-amd64-install:
    if: github.repository == 'yunzhanlin/yunzhan-apps' && github.ref == 'refs/heads/codex/app-candidate'
    strategy:
      fail-fast: false
      matrix:
        os_case: [debian12, debian13, ubuntu22, ubuntu24, ubuntu26]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download original reviewed signed cohort
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-php-c40r2-assets"
          gh release view qa-phpsessionguardcandidate40r2-20261031-qa1 --repo yunzhanlin/yunzhan-apps --json isDraft,isPrerelease > "$RUNNER_TEMP/cohort.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert not v["isDraft"] and v["isPrerelease"]' "$RUNNER_TEMP/cohort.json"
          gh release download qa-phpsessionguardcandidate40r2-20261031-qa1 --repo yunzhanlin/yunzhan-apps --dir "$RUNNER_TEMP/native-php-c40r2-assets"
          python3 - "$RUNNER_TEMP/native-php-c40r2-assets" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          assert hashlib.sha256((base / 'assets.json').read_bytes()).hexdigest() == '7016b422bad3f009bc33bb36794a91553e7870b2446483534a850859bf5915c1'
          manifest = json.loads((base / 'assets.json').read_bytes())
          assert manifest['source_inputs_sha256'] == '73faf3045116826c44b2077653e751406a101e046e01b9cf66a58c4fc06314e5'
          for name, digest in manifest['files'].items():
              assert pathlib.PurePath(name).name == name
              assert hashlib.sha256((base / name).read_bytes()).hexdigest() == digest
          print('Exact original signed cohort verified')
          PY
      - name: Prepare actual hardware guest tools
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=0
          sudo apt-get install -y --no-upgrade --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          test -c /dev/kvm
      - name: Fresh original-key programme, four PHP applications and actual FPM upload journey
        env:
          OS_CASE: ${{ matrix.os_case }}
        run: |
          set -eu
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/native-php-c40r2-public"
          sudo -n python3 -I -B scripts/native-php-c40r2/kvm.py "$RUNNER_TEMP/native-php-c40r2-assets" scripts/native-php-c40r2 "$RUNNER_TEMP/native-php-c40r2-public" "$OS_CASE"
      - name: Retain public proof and encrypted complete original QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-php-c40r2-amd64-${{ matrix.os_case }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-php-c40r2-public/
          retention-days: 7
          if-no-files-found: warn
